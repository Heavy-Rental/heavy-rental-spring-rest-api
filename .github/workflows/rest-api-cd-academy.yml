# =============================================================================
# Install into: heavy-rental-spring-rest-api
# Path:         .github/workflows/rest-api-cd-academy.yml
# =============================================================================
# Reusable. Callers: rest-api-cd-academy-caller.yml and rest-api-cd-paid-caller.yml
# =============================================================================

name: REST API CD pipeline

on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      aws_environment:
        required: true
        type: string
      image_ref:
        required: false
        type: string
        default: ""
      image_http_url:
        required: false
        type: string
        default: ""
      aws_access_key_id:
        required: false
        type: string
        default: ""
      aws_secret_access_key:
        required: false
        type: string
        default: ""
      aws_session_token:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  assert-lab:
    name: Assert AWS profile
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 5
    outputs:
      account_id: ${{ steps.sts.outputs.account_id }}
      bucket: ${{ steps.sts.outputs.bucket }}
      ssm_bucket: ${{ steps.sts.outputs.ssm_bucket }}
      deployment: ${{ steps.sts.outputs.deployment }}
    steps:
      - name: Assert academy or AWS_ACTUAL
        env:
          ENV_NAME: ${{ inputs.aws_environment }}
        run: |
          set -euo pipefail
          if [ "${ENV_NAME}" != "academy" ] && [ "${ENV_NAME}" != "AWS_ACTUAL" ]; then
            echo "::error::aws_environment must be academy or AWS_ACTUAL (got '${ENV_NAME}')."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nosemgrep: heavy-rental.gha.hardcoded-workflow-secret

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: ${{ inputs.aws_environment }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_access_key_id: ${{ inputs.aws_access_key_id || secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ inputs.aws_secret_access_key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ inputs.aws_session_token || secrets.AWS_SESSION_TOKEN }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Prove the AWS session is live
        id: sts
        env:
          ACTION: ${{ inputs.action }}
          PROFILE: ${{ inputs.aws_environment }}
          DEPLOYMENT: ${{ inputs.aws_environment == 'AWS_ACTUAL' && 'actual' || 'academy' }}
        run: |
          set -euo pipefail
          if ! ARN=$(aws sts get-caller-identity --query Arn --output text); then
            echo "::error::sts failed. Academy: Start Lab and paste a fresh session token. Paid: check AWS_ROLE_TO_ASSUME / OIDC."
            exit 1
          fi
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT}" >> "$GITHUB_OUTPUT"
          echo "deployment=${DEPLOYMENT}" >> "$GITHUB_OUTPUT"
          echo "bucket=heavy-rental-tfstate-${ACCOUNT}-${DEPLOYMENT}" >> "$GITHUB_OUTPUT"
          echo "ssm_bucket=heavy-rental-ssm-${ACCOUNT}-${DEPLOYMENT}" >> "$GITHUB_OUTPUT"
          {
            echo "### AWS profile \`${PROFILE}\` (deployment \`${DEPLOYMENT}\`)"
            echo ""
            echo "Caller: \`${ARN}\`"
            echo "Account: \`${ACCOUNT}\`"
            echo "Action: \`${ACTION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  discover-targets:
    name: Discover asg-rest
    needs: [assert-lab]
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nosemgrep: heavy-rental.gha.hardcoded-workflow-secret

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: ${{ inputs.aws_environment }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_access_key_id: ${{ inputs.aws_access_key_id || secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ inputs.aws_secret_access_key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ inputs.aws_session_token || secrets.AWS_SESSION_TOKEN }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: asg-rest InService + SSM Online + secret shell
        run: |
          set -euo pipefail
          ASG=asg-rest
          if ! aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${ASG}" \
            --query 'AutoScalingGroups[0].AutoScalingGroupName' \
            --output text | grep -qx "${ASG}"; then
            echo "::error::${ASG} is missing. Run infra CD action=apply first."
            exit 1
          fi
          DESIRED="$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${ASG}" \
            --query 'AutoScalingGroups[0].DesiredCapacity' --output text)"
          if [ "${DESIRED}" = "0" ]; then
            echo "::error::${ASG} desired=0. Scale via infra (not this CD). Start Lab if the session ended."
            exit 1
          fi
          mapfile -t IDS < <(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${ASG}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text | tr '\t' '\n' | awk 'NF')
          if [ "${#IDS[@]}" -eq 0 ]; then
            echo "::error::No InService instances on ${ASG}. Start Lab or wait for the ASG."
            exit 1
          fi
          ONLINE=0
          for id in "${IDS[@]}"; do
            ping="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${id}" \
              --query 'InstanceInformationList[?PingStatus==`Online`].InstanceId' \
              --output text || true)"
            if [ -n "${ping}" ] && [ "${ping}" != "None" ]; then
              ONLINE=$((ONLINE + 1))
            fi
          done
          if [ "${ONLINE}" -eq 0 ]; then
            echo "::error::No SSM Online guests on ${ASG}. Start Lab or run infra configure-only."
            exit 1
          fi
          if ! aws secretsmanager describe-secret --secret-id heavy-rental/rest >/dev/null; then
            echo "::error::heavy-rental/rest is missing. Run infra sync-secrets / apply first."
            exit 1
          fi
          {
            echo "### Discover asg-rest"
            echo ""
            echo "InService instances: ${#IDS[@]}"
            echo "SSM Online: ${ONLINE}"
            echo "Secret \`heavy-rental/rest\`: present (SecretString not printed)."
          } >> "$GITHUB_STEP_SUMMARY"

  resolve-image:
    name: Resolve CI image
    needs: [assert-lab]
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 10
    outputs:
      rest_image: ${{ steps.resolve.outputs.rest_image }}
      image_http_url: ${{ steps.resolve.outputs.image_http_url }}
    steps:
      - name: Choose tar URL or registry tag
        id: resolve
        env:
          IMAGE_REF_INPUT: ${{ inputs.image_ref }}
          IMAGE_HTTP_INPUT: ${{ inputs.image_http_url }}
          IMAGE_HTTP_VAR: ${{ vars.IMAGE_HTTP_URL }}
          REST_IMAGE_VAR: ${{ vars.REST_IMAGE }}
        run: |
          set -euo pipefail
          HTTP_URL="${IMAGE_HTTP_INPUT:-}"
          if [ -z "${HTTP_URL}" ]; then
            HTTP_URL="${IMAGE_HTTP_VAR:-}"
          fi
          TAG="${IMAGE_REF_INPUT:-}"
          if [ -z "${TAG}" ]; then
            TAG="${REST_IMAGE_VAR:-}"
          fi
          if [ -z "${HTTP_URL}" ] && [ -z "${TAG}" ]; then
            echo "::error::action=deploy needs image_ref, Environment REST_IMAGE, or image_http_url / IMAGE_HTTP_URL. There is no stock Tomcat."
            exit 1
          fi
          if [ -n "${TAG}" ] && [[ "${TAG}" =~ ^https?:// ]]; then
            echo "::error::image_ref is an HTTP URL. Put the tar on image_http_url instead."
            exit 1
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::docker load still needs a compose tag (image_ref or REST_IMAGE) that matches the loaded image name."
            exit 1
          fi
          if [[ "${TAG}" == ghcr.io/* ]]; then
            OWNER_REPO_TAG="${TAG#ghcr.io/}"
            REPO="${OWNER_REPO_TAG%:*}"
            REF="${OWNER_REPO_TAG##*:}"
            if [ "${REF}" = "${OWNER_REPO_TAG}" ]; then
              REF=latest
            fi
            TOKEN="$(curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:pull" | jq -r '.token // empty' || true)"
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${REPO}/manifests/${REF}" || echo 000)"
            if [ "${CODE}" = "401" ] || [ "${CODE}" = "403" ]; then
              echo "::error::${TAG} is not pullable without a token (private GHCR). Copy to ECR or pass image_http_url. Do not put a PAT on the guest."
              exit 1
            fi
            if [ "${CODE}" != "200" ]; then
              echo "::error::Cannot read ${TAG} from GHCR (HTTP ${CODE}). Use a public tag, ECR, or image_http_url."
              exit 1
            fi
          fi
          echo "rest_image=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_http_url=${HTTP_URL}" >> "$GITHUB_OUTPUT"
          {
            echo "### Resolve image"
            echo ""
            echo "rest_image: \`${TAG}\`"
            if [ -n "${HTTP_URL}" ]; then
              echo "image_http_url: set (not printed)."
            else
              echo "image_http_url: empty (registry pull)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ansible-rest:
    name: Compose playbook on asg-rest
    needs: [assert-lab, discover-targets, resolve-image]
    if: always() && needs.assert-lab.result == 'success' && needs.discover-targets.result == 'success' && (inputs.action == 'deploy' || inputs.action == 'configure-only') && (needs.resolve-image.result == 'success' || needs.resolve-image.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nosemgrep: heavy-rental.gha.hardcoded-workflow-secret

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: ${{ inputs.aws_environment }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_access_key_id: ${{ inputs.aws_access_key_id || secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ inputs.aws_secret_access_key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ inputs.aws_session_token || secrets.AWS_SESSION_TOKEN }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Session Manager plugin
        run: |
          set -euo pipefail
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/ssm.deb
          sudo dpkg -i /tmp/ssm.deb

      - name: Install Ansible 14.3.1
        run: |
          set -euo pipefail
          python3 -m pip install --user "ansible==14.3.1" "boto3>=1.35.0" "botocore>=1.35.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          ansible-galaxy collection install -r deploy-pipeline/ansible/requirements.yml

      - name: ansible-playbook --limit rest
        env:
          ACTION: ${{ inputs.action }}
          RESOLVED_IMAGE: ${{ needs.resolve-image.outputs.rest_image }}
          RESOLVED_HTTP: ${{ needs.resolve-image.outputs.image_http_url }}
          REST_IMAGE_VAR: ${{ vars.REST_IMAGE }}
          IMAGE_REF_INPUT: ${{ inputs.image_ref }}
          IMAGE_HTTP_VAR: ${{ vars.IMAGE_HTTP_URL }}
          IMAGE_HTTP_INPUT: ${{ inputs.image_http_url }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          BUCKET: ${{ needs.assert-lab.outputs.bucket }}
          SSM_BUCKET: ${{ needs.assert-lab.outputs.ssm_bucket }}
          DEPLOYMENT: ${{ needs.assert-lab.outputs.deployment }}
          DYNAMIC_PRICING_ENABLED: ${{ vars.DYNAMIC_PRICING_ENABLED }}
          PRICING_DEFAULT_DISTANCE_KM: ${{ vars.PRICING_DEFAULT_DISTANCE_KM }}
          PRICING_ORIGIN_POSTAL_CODE: ${{ vars.PRICING_ORIGIN_POSTAL_CODE }}
          PRICING_DISTANCE_LOOKUP_ENABLED: ${{ vars.PRICING_DISTANCE_LOOKUP_ENABLED }}
        working-directory: deploy-pipeline/ansible
        run: |
          set -euo pipefail
          chmod +x inventory/aws_ssm.py
          if [ "${DEPLOYMENT}" = "actual" ]; then
            ANSIBLE_S3="${SSM_BUCKET}"
          else
            ANSIBLE_S3="${BUCKET}"
          fi
          if [ "${ACTION}" = "deploy" ]; then
            REST="${RESOLVED_IMAGE:-}"
            HTTP_URL="${RESOLVED_HTTP:-}"
          else
            REST="${IMAGE_REF_INPUT:-}"
            if [ -z "${REST}" ]; then REST="${REST_IMAGE_VAR:-}"; fi
            HTTP_URL="${IMAGE_HTTP_INPUT:-}"
            if [ -z "${HTTP_URL}" ]; then
              HTTP_URL="${IMAGE_HTTP_VAR:-}"
            fi
            if [ -z "${REST}" ]; then
              echo "::error::action=configure-only needs Environment REST_IMAGE or image_ref. There is no stock Tomcat."
              exit 1
            fi
          fi
          if [ -z "${REST}" ]; then
            echo "::error::rest_image is empty."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          keys = (
              "DYNAMIC_PRICING_ENABLED",
              "PRICING_DEFAULT_DISTANCE_KM",
              "PRICING_ORIGIN_POSTAL_CODE",
              "PRICING_DISTANCE_LOOKUP_ENABLED",
          )
          overlay = {k: os.environ[k] for k in keys if os.environ.get(k, "").strip()}
          path = Path("rest-profile-overlay.json")
          path.write_text(json.dumps({"rest_profile_overlay": overlay}))
          path.chmod(0o600)
          print(f"Pricing overlay keys: {', '.join(sorted(overlay)) or '(none — SM/app defaults)'}")
          PY
          ansible-playbook playbooks/rest.yml \
            --limit rest \
            -e "rest_image=${REST}" \
            -e "image_http_url=${HTTP_URL}" \
            -e "aws_region=${AWS_REGION}" \
            -e "ansible_aws_ssm_bucket_name=${ANSIBLE_S3}" \
            -e @rest-profile-overlay.json
          {
            echo "### Ansible rest"
            echo ""
            echo "Compose via SSM, \`--limit rest\`. Image: \`${REST}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Health GET :8080
    needs: [assert-lab, discover-targets, ansible-rest]
    if: >-
      always()
      && needs.assert-lab.result == 'success'
      && needs.discover-targets.result == 'success'
      && (
        (inputs.action == 'verify' && needs.ansible-rest.result == 'skipped')
        || ((inputs.action == 'deploy' || inputs.action == 'configure-only') && needs.ansible-rest.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: ${{ inputs.aws_environment }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nosemgrep: heavy-rental.gha.hardcoded-workflow-secret

      - uses: ./.github/actions/resolve-aws-profile
        with:
          profile: ${{ inputs.aws_environment }}
          aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws_access_key_id: ${{ inputs.aws_access_key_id || secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ inputs.aws_secret_access_key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ inputs.aws_session_token || secrets.AWS_SESSION_TOKEN }}
          aws_role_to_assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: SSM GET :8080 on asg-rest
        run: |
          set -euo pipefail
          ASG=asg-rest
          mapfile -t IDS < <(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${ASG}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text | tr '\t' '\n' | awk 'NF')
          ONLINE=()
          for id in "${IDS[@]}"; do
            ping="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${id}" \
              --query 'InstanceInformationList[?PingStatus==`Online`].InstanceId' \
              --output text || true)"
            if [ -n "${ping}" ] && [ "${ping}" != "None" ]; then
              ONLINE+=("${id}")
            fi
          done
          if [ "${#ONLINE[@]}" -eq 0 ]; then
            echo "::error::No SSM Online guests to health-check."
            exit 1
          fi
          OK=0
          for id in "${ONLINE[@]}"; do
            CMD_ID="$(aws ssm send-command \
              --instance-ids "${id}" \
              --document-name AWS-RunShellScript \
              --parameters 'commands=["code=$(curl -sS -o /dev/null -w %{http_code} http://127.0.0.1:8080/actuator/health || true); if [ \"$code\" = \"000\" ]; then curl -sS -o /dev/null -w %{http_code} http://127.0.0.1:8080/; else echo -n \"$code\"; fi"]' \
              --query Command.CommandId --output text)"
            if ! aws ssm wait command-executed --command-id "${CMD_ID}" --instance-id "${id}"; then
              echo "::warning::SSM command did not finish on a guest (id omitted)."
              continue
            fi
            CODE="$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" \
              --instance-id "${id}" \
              --query StandardOutputContent --output text | tr -d '[:space:]')"
            case "${CODE}" in
              200|301|302|401|403) OK=$((OK + 1)) ;;
              *) echo "::warning::GET :8080 returned '${CODE}' on a guest (id omitted)." ;;
            esac
          done
          if [ "${OK}" -eq 0 ]; then
            echo "::error::No REST guest answered GET :8080 with 200–302 or 401/403. Haystack down does not fail this job by itself."
            exit 1
          fi
          {
            echo "### Verify REST :8080"
            echo ""
            echo "Guests with GET :8080 accepted: ${OK} / ${#ONLINE[@]}"
            echo "A failing Haystack (\`HAYSTACK_BASE_URL\`) does not fail this job."
          } >> "$GITHUB_STEP_SUMMARY"
