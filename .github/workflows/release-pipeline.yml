# =============================================================================
# Heavy Rental Spring REST API — Release CI Pipeline (reusable)
# =============================================================================
# Stages (priority order — Integration is highest priority):
#   1. Integration      (HIGHEST) checkout master, Java 21 + Maven, resolve deps, layout
#   2. Quality Control  needs Integration — compile, tests (Postgres), package WAR
#   3. Packaging        needs Integration + QC — versioned WAR + Docker image tar
#   4. DAST             needs Packaging — run image, OWASP ZAP + Dastardly + Nuclei
#                       + combined-dast-report.pdf (artifact dast-combined-report-pdf)
#   5. Publish          needs DAST — public GHCR + GitHub Release on master
#
# SAST/CodeQL live on Integration CI (develop), not Release.
# DAST reports: dast-reports/ (ZAP JSON/HTML, Dastardly XML, Nuclei JSONL,
#   combined-dast-report.pdf). Dedicated artifact: dast-combined-report-pdf.
#   - CodeQL → GitHub Code Scanning (native SARIF via analyze)
# Human-readable console output is for gates/logs only, not the report standard.
#
# GitHub Flow (https://docs.github.com/en/get-started/using-github/github-flow)
# --------------------------------------------------------------------------
# Invoked via rest-api-release-caller.yml on workflow_dispatch only
# (Actions → Release → Run workflow). This workflow creates the GitHub
# Release — do not add on: release. Feature-branch / develop validation
# remains rest-api-ci-caller.yml (Integration first). SAST/CodeQL live on
# Integration CI, not here.
#
#   feature → develop (CI) → merge to master → workflow_dispatch → this pipeline
#
# Packaging output (Spring Boot WAR + container image for deploy):
#   ./mvnw -DskipTests package → target/*.war only (no JAR / java -jar image)
#   Versioned + stable WAR copies for overall-project-deploy
#   Docker image is always-generated tomcat:10.1-jdk21-temurin + ROOT.war
#   (app Dockerfile is not the deploy image). Works on Docker Desktop,
#   compose, Academy, or any OCI runtime: docker run -p 8080:8080 -e …
#   Image is env-driven: no POSTGRES_*, SPRING_DATASOURCE_*,
#   HAYSTACK_*, STRIPE_*, APP_JWT_*, or REST_API_* in ENV/ARG/.env.
#   Packaging refuses baked config, requires WEB-INF in the WAR, and
#   starts Tomcat briefly to prove :8080 binds (no live database).
#   Image saved as gzipped tar artifact. Publish (not Packaging) pushes
#   GHCR as ghcr.io/<owner>/heavy_rental_rest_api:<x.y.z> and :latest.
#   <x.y.z> is the previous GHCR semver patch-bumped (first publish: 1.0.0).
#   spring-datasource.env is a workflow artifact (localhost JDBC, no
#   password). Not copied into the image. Guest CD reads heavy-rental/rest.
#
# Application:
#   https://github.com/Heavy-Rental/heavy-rental-spring-rest-api
#   Spring Boot 4.x · Java 21 · Maven (mvnw) · PostgreSQL · WAR packaging
#   DEFAULT_APP_REPOSITORY below is Heavy-Rental (not the SA62-team1 act
#   fallback used by Fast Feedback / Integration CI). Checkout is always master.
#
# How the REST API uses this on release
# -------------------------------------
# Install both files into the Spring REST API repository:
#
#   .github/workflows/release-pipeline.yml         ← this file (reusable only)
#   .github/workflows/rest-api-release-caller.yml  ← sole allowed entry point
#
# This file exposes only workflow_call (no push / PR / workflow_dispatch).
# A gate job rejects any caller other than rest-api-release-caller.yml.
#
# The caller invokes this workflow with:
#   uses: ./.github/workflows/release-pipeline.yml
#
# Authoring copy lives in this tree. Install into the Spring repo as
#   .github/workflows/release-pipeline.yml
# There is no .github/workflows/rest-api-release.yml mirror in this repo.
#
# Local validation (pipeline-development repo root, in the devcontainer):
#   actionlint heavy-rental-rest-api/release-pipeline/release-pipeline.yml
#
# Quality Control uses environment: production (hardcoded). The caller
# forwards REST_API_DB_* via an explicit secrets map (not secrets: inherit).
# A uses: job cannot read Environment secrets, so configure them as
# Repository secrets in the APPLICATION repo (and optionally also on
# Environment "production" for isolation / protection rules):
#   Settings → Secrets and variables → Actions → Repository secrets
#
# Names (exact match, same as Integration CI):
#   REST_API_DB_NAME
#   REST_API_DB_USER
#   REST_API_DB_PASSWORD
#   REST_API_DB_PORT
#
# REST_API_DB_URL is NOT required. After Start PostgreSQL, QC builds:
#   jdbc:postgresql://localhost:<PORT>/<NAME>
# These start a local Docker Postgres for tests. They are not Academy RDS.
# Guest CD reads heavy-rental/rest (infra sync-secrets).
# Do not set environment: on the caller uses: job.
# Never commit real values.
# =============================================================================

name: REST API Release CI

# Reusable only — no push, pull_request, or workflow_dispatch.
# Sole allowed caller: .github/workflows/rest-api-release-caller.yml (enforced below).
on:
  workflow_call:
    inputs:
      app_repository:
        description: >
          Override application repository (owner/name). Leave empty to use the
          calling repository (required when the REST API invokes this workflow).
        required: false
        type: string
        default: ""
      app_ref:
        description: >
          Override git ref (unused on Release — checkout is always master).
        required: false
        type: string
        default: ""
      github_environment:
        description: >
          Unused. Quality Control hardcodes environment: production. Callers still
          pass production so the contract stays visible.
        required: false
        type: string
        default: production
    secrets:
      REST_API_DB_NAME:
        description: PostgreSQL database name
        required: false
      REST_API_DB_USER:
        description: PostgreSQL username
        required: false
      REST_API_DB_PASSWORD:
        description: PostgreSQL password
        required: false
      REST_API_DB_PORT:
        description: Host port for CI Postgres container
        required: false
      # REST_API_DB_URL is derived after Docker Postgres starts (not a secret)

# One run per repository ref; do not cancel in-flight packaging
concurrency:
  group: rest-api-release-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Required for github/codeql-action/upload-sarif (Security stage → Code Scanning)
  security-events: write
  actions: read
  # Required to push the packaging Docker image to GHCR (non-PR runs)
  packages: write

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin
  APP_PATH: app
  DEFAULT_APP_REPOSITORY: Heavy-Rental/heavy-rental-spring-rest-api
  DEFAULT_APP_REF: master
  # Docker image naming (Tomcat hosts the Spring Boot WAR)
  IMAGE_NAME: heavy_rental_rest_api
  TOMCAT_BASE_IMAGE: tomcat:10.1-jdk21-temurin
  # Stable artifact names so DAST/Publish do not depend on packaging job outputs
  # (needs.*.outputs is empty for jobs with environment: in this reusable workflow).
  IMAGE_ARCHIVE: heavy_rental_rest_api-image.tar.gz
  IMAGE_META: image-meta.env
  # Non-sensitive Spring/JPA settings only — credentials come from GitHub Secrets
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.wagon.http.retryHandler.count=3"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Caller gate — only rest-api-release-caller.yml may invoke this workflow
  # ---------------------------------------------------------------------------
  assert-caller:
    name: Assert caller
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow only rest-api-release-caller.yml
        env:
          # github context is that of the caller workflow for reusable workflows
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          echo "github.workflow_ref=${WORKFLOW_REF}"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.workflow=${WORKFLOW_NAME}"
          case "${WORKFLOW_REF}" in
            */.github/workflows/rest-api-release-caller.yml@*)
              echo "Allowed caller: rest-api-release-caller.yml"
              {
                echo "### Caller gate"
                echo ""
                echo "Invoked by \`rest-api-release-caller.yml\` — OK."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::release-pipeline.yml may only be invoked by .github/workflows/rest-api-release-caller.yml (got: ${WORKFLOW_REF})"
              exit 1
              ;;
          esac

  # ---------------------------------------------------------------------------
  # 1. Integration — HIGHEST PRIORITY (release never packages without this)
  #    Quality, Security, and Packaging all depend on Integration succeeding.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [assert-caller]
    timeout-minutes: 20
    outputs:
      app_repository: ${{ steps.meta.outputs.app_repository }}
      app_ref: ${{ steps.meta.outputs.app_ref }}
      checkout_mode: ${{ steps.meta.outputs.checkout_mode }}
    steps:
      - name: Resolve application source (same-repo caller vs remote override)
        id: meta
        env:
          # Bind contexts here — never interpolate github/inputs directly in run: scripts
          # (avoids Semgrep run-shell-injection).
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.app_repository }}
          INPUT_REF: ${{ inputs.app_ref }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          DEFAULT_APP_REF_VALUE: ${{ env.DEFAULT_APP_REF }}
        run: |
          set -euo pipefail
          EVENT="${EVENT_NAME}"
          INPUT_REPO="${INPUT_REPO}"
          INPUT_REF="${INPUT_REF}"

          if [ -n "${INPUT_REPO}" ] && [ "${INPUT_REPO}" != "${GH_REPOSITORY}" ]; then
            APP_REPO="${INPUT_REPO}"
            APP_REF="master"
            MODE=remote
          else
            # Same-repo caller: use this commit
            APP_REPO="${GH_REPOSITORY}"
            APP_REF="master"
            MODE=caller
          fi

          echo "app_repository=$APP_REPO" >> "$GITHUB_OUTPUT"
          echo "app_ref=$APP_REF" >> "$GITHUB_OUTPUT"
          echo "checkout_mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Source resolution"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$EVENT\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Repository | \`$APP_REPO\` |"
            echo "| Ref | \`$APP_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integrating application: $APP_REPO @ $APP_REF (mode=$MODE)"

      - name: Checkout calling repository (release / push head)
        if: steps.meta.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          ref: master
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: steps.meta.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.meta.outputs.app_repository }}
          ref: ${{ steps.meta.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_PATH }}/pom.xml

      - name: Ensure Maven Wrapper is executable
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            echo "Using Maven Wrapper (./mvnw)"
          else
            echo "::error::mvnw not found — this pipeline expects the Maven Wrapper in the REST API repo."
            exit 1
          fi

      - name: Resolve Maven dependencies
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./mvnw -B -ntp dependency:resolve dependency:resolve-plugins

      - name: Verify project layout and toolchain
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          echo "==> Java / Maven versions"
          java -version
          ./mvnw -v
          echo "==> Required files"
          test -f pom.xml
          test -f mvnw
          test -d src/main/java
          test -d src/main/resources
          echo "==> Packaging from pom.xml"
          PACKAGING="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.packaging)"
          ARTIFACT="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.artifactId)"
          VERSION="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          JAVA_PROP="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=java.version || true)"
          echo "artifactId=$ARTIFACT version=$VERSION packaging=$PACKAGING java.version=$JAVA_PROP"
          {
            echo "### Integration checks"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Artifact | \`$ARTIFACT\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Packaging | \`$PACKAGING\` |"
            echo "| Java (pom) | \`$JAVA_PROP\` |"
            echo "| Runner Java | \`${{ env.JAVA_VERSION }}\` (${{ env.JAVA_DISTRIBUTION }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integration checks passed."

      - name: Upload Maven project fingerprint
        uses: actions/upload-artifact@v7
        with:
          name: release-integration-metadata
          path: |
            ${{ env.APP_PATH }}/pom.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Quality control — compile, test (with PostgreSQL), package WAR
  # ---------------------------------------------------------------------------
  quality-control:
    name: Quality Control
    runs-on: ubuntu-latest
    needs: [integration]
    # Hardcoded Environment name (more reliable than dynamic expressions for secrets).
    # Loads Environment secrets + any secrets passed via explicit secrets map.
    environment:
      name: production
      deployment: false
    timeout-minutes: 30
    steps:
      - name: Verify required database secrets are configured
        env:
          REST_API_DB_NAME: ${{ secrets.REST_API_DB_NAME }}
          REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
          REST_API_DB_PASSWORD: ${{ secrets.REST_API_DB_PASSWORD }}
          REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
        run: |
          set -euo pipefail
          echo "Quality Control secrets source: caller explicit secrets map and/or GitHub Environment 'production'."
          missing=()
          [ -n "${REST_API_DB_NAME}" ] || missing+=(REST_API_DB_NAME)
          [ -n "${REST_API_DB_USER}" ] || missing+=(REST_API_DB_USER)
          [ -n "${REST_API_DB_PASSWORD}" ] || missing+=(REST_API_DB_PASSWORD)
          [ -n "${REST_API_DB_PORT}" ] || missing+=(REST_API_DB_PORT)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo ""
            echo "Configure in the APPLICATION repository (where this workflow runs), not pipeline-development:"
            echo "  1) Settings → Secrets and variables → Actions → Repository secrets"
            echo "     (required for the caller explicit secrets map)"
            echo "  2) Settings → Environments → production → Environment secrets"
            echo "     (optional; this job also uses environment: production)"
            echo ""
            echo "Required names (exact, case-sensitive):"
            echo "  REST_API_DB_NAME, REST_API_DB_USER, REST_API_DB_PASSWORD, REST_API_DB_PORT"
            echo "  (REST_API_DB_URL is optional — built after Docker Postgres starts)"
            echo ""
            echo "Caller must include: explicit secrets map"
            echo "This job uses: environment: production"
            exit 1
          fi
          if ! [[ "${REST_API_DB_PORT}" =~ ^[0-9]+$ ]]; then
            echo "::error::REST_API_DB_PORT must be a numeric TCP port."
            exit 1
          fi
          echo "All required database secrets are present (values not logged)."

      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          ref: master
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_PATH }}/pom.xml

      - name: Ensure Maven Wrapper is executable
        working-directory: ${{ env.APP_PATH }}
        run: chmod +x ./mvnw

      - name: Start PostgreSQL (Docker; credentials and port from secrets)
        id: dburl
        env:
          REST_API_DB_NAME: ${{ secrets.REST_API_DB_NAME }}
          REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
          REST_API_DB_PASSWORD: ${{ secrets.REST_API_DB_PASSWORD }}
          REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
        run: |
          set -euo pipefail
          docker rm -f rest-api-release-postgres >/dev/null 2>&1 || true
          docker run -d --name rest-api-release-postgres \
            -e POSTGRES_DB="${REST_API_DB_NAME}" \
            -e POSTGRES_USER="${REST_API_DB_USER}" \
            -e POSTGRES_PASSWORD="${REST_API_DB_PASSWORD}" \
            -p "${REST_API_DB_PORT}:5432" \
            postgres:16-alpine

          JDBC_URL="jdbc:postgresql://localhost:${REST_API_DB_PORT}/${REST_API_DB_NAME}"
          {
            echo "REST_API_DB_URL=${JDBC_URL}"
            echo "REST_API_DB_NAME=${REST_API_DB_NAME}"
            echo "REST_API_DB_USER=${REST_API_DB_USER}"
            echo "REST_API_DB_PORT=${REST_API_DB_PORT}"
          } >> "$GITHUB_ENV"

          echo "PostgreSQL container started."
          echo "Derived REST_API_DB_URL=jdbc:postgresql://localhost:${REST_API_DB_PORT}/<db> (password not in URL)."

      - name: Wait for PostgreSQL
        env:
          REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
          REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
        run: |
          set -euo pipefail
          PORT="${REST_API_DB_PORT}"
          for i in $(seq 1 30); do
            if docker exec rest-api-release-postgres pg_isready -U "${REST_API_DB_USER}" >/dev/null 2>&1; then
              echo "PostgreSQL is accepting connections on localhost:${PORT}"
              exit 0
            fi
            if timeout 1 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/${PORT}" 2>/dev/null; then
              :
            fi
            echo "Waiting for PostgreSQL... ($i)"
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready in time on the configured port"
          docker logs rest-api-release-postgres 2>&1 | tail -n 50 || true
          exit 1

      - name: Compile (main + test sources)
        working-directory: ${{ env.APP_PATH }}
        run: ./mvnw -B -ntp -DskipTests compile test-compile

      - name: Unit and Spring Boot tests
        working-directory: ${{ env.APP_PATH }}
        env:
          # Spring Boot binds these env vars automatically — do not pass passwords
          # on the Maven CLI (would appear in process listings).
          # REST_API_DB_URL was built after Start PostgreSQL and written to GITHUB_ENV.
          SPRING_DATASOURCE_URL: ${{ env.REST_API_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.REST_API_DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.REST_API_DB_PASSWORD }}
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${{ env.SPRING_DATASOURCE_DRIVER_CLASS_NAME }}
          SPRING_JPA_DATABASE_PLATFORM: ${{ env.SPRING_JPA_DATABASE_PLATFORM }}
        run: |
          set -euo pipefail
          if [ -z "${REST_API_DB_URL:-}" ]; then
            echo "::error::REST_API_DB_URL is empty — Start PostgreSQL must export it via GITHUB_ENV."
            exit 1
          fi
          echo "Running tests with SPRING_DATASOURCE_URL derived from Docker Postgres (password not logged)."
          # Use runner-native $GITHUB_WORKSPACE (never github context interpolation inside run scripts)
          mkdir -p "${GITHUB_WORKSPACE}/test-reports"
          ./mvnw -B -ntp test
          # Collect surefire / failsafe reports when present
          if [ -d target/surefire-reports ]; then
            cp -a target/surefire-reports "${GITHUB_WORKSPACE}/test-reports/" || true
          fi
          if [ -d target/failsafe-reports ]; then
            cp -a target/failsafe-reports "${GITHUB_WORKSPACE}/test-reports/" || true
          fi

      - name: Package WAR (skip re-running tests)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -DskipTests package
          echo "==> Build artifacts"
          ls -lah target/ || true
          WAR_COUNT="$(find target -maxdepth 1 -type f \( -name '*.war' -o -name '*.jar' \) | wc -l | tr -d ' ')"
          if [ "${WAR_COUNT}" -lt 1 ]; then
            echo "::error::No .war/.jar produced under target/ after package"
            exit 1
          fi
          find target -maxdepth 1 -type f \( -name '*.war' -o -name '*.jar' \) -ls
          {
            echo "### Quality control"
            echo ""
            echo "Compile, tests, and package completed successfully."
            echo ""
            echo "Artifacts:"
            echo '```'
            find target -maxdepth 1 -type f \( -name '*.war' -o -name '*.jar' \) -printf '%f (%s bytes)\n' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop PostgreSQL
        if: always()
        run: |
          set -euo pipefail
          docker rm -f rest-api-release-postgres >/dev/null 2>&1 || true
          echo "PostgreSQL container stopped."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-quality-test-reports
          path: |
            test-reports/
            ${{ env.APP_PATH }}/target/surefire-reports/
            ${{ env.APP_PATH }}/target/failsafe-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: rest-api-release-build
          path: |
            ${{ env.APP_PATH }}/target/*.war
            ${{ env.APP_PATH }}/target/*.jar
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. Security testing — SAST (Semgrep) + SCA / filesystem (Trivy)
  # ---------------------------------------------------------------------------
  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    # Integration first; packaging waits for QC (SAST/CodeQL are Integration CI only)
    needs: [integration, quality-control]
    outputs:
      image_tag: ${{ steps.package.outputs.image_tag }}
      image_local: ${{ steps.package.outputs.image_local }}
      image_remote: ${{ steps.package.outputs.image_remote }}
      image_remote_latest: ${{ steps.package.outputs.image_remote_latest }}
      image_tar: ${{ steps.package.outputs.image_tar }}
      version: ${{ steps.package.outputs.version }}
    environment: production
    timeout-minutes: 30
    steps:
      - name: Write datasource env template
        env:
          REST_API_DB_NAME: ${{ secrets.REST_API_DB_NAME }}
          REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
          REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
        run: |
          set -euo pipefail
          LOCAL_JDBC="jdbc:postgresql://localhost:${REST_API_DB_PORT}/${REST_API_DB_NAME}"
          mkdir -p "${GITHUB_WORKSPACE}/release-deploy-config"
          {
            echo "# Generated by rest-api release packaging — local QC JDBC (no password)."
            echo "# Guest compose reads heavy-rental/rest (infra sync-secrets)."
            echo "SPRING_DATASOURCE_URL=${LOCAL_JDBC}"
            echo "SPRING_DATASOURCE_USERNAME=${REST_API_DB_USER}"
            echo "SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver"
            echo "SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect"
            echo "# Set SPRING_DATASOURCE_PASSWORD and replace URL from Secrets Manager at deploy."
          } > "${GITHUB_WORKSPACE}/release-deploy-config/spring-datasource.env"
          {
            echo "### Datasource env artifact"
            echo ""
            echo "Localhost QC URL from \`REST_API_DB_*\` (no password). Academy CD does not use this file."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload datasource env template
        uses: actions/upload-artifact@v7
        with:
          name: rest-api-release-cloud-datasource
          path: release-deploy-config/
          retention-days: 14
          if-no-files-found: error

      - name: Checkout calling repository (release / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          ref: master
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.integration.outputs.app_repository }}
          ref: ${{ needs.integration.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_PATH }}/pom.xml

      - name: Ensure Maven Wrapper is executable
        working-directory: ${{ env.APP_PATH }}
        run: chmod +x ./mvnw

      - name: Production package (WAR, skip re-running tests)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -DskipTests package
          echo "==> target/ after package"
          ls -lah target/ || true

      - name: Resolve next heavy_rental_rest_api version
        id: image-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          OWNER="${GH_REPOSITORY_OWNER}"
          PKG="${IMAGE_NAME,,}"

          list_tags() {
            local path="$1"
            gh api --paginate "${path}" --jq '.[] | .metadata.container.tags[]?' 2>/dev/null || true
          }

          TAGS="$(list_tags "/orgs/${OWNER}/packages/container/${PKG}/versions")"
          if [ -z "${TAGS}" ]; then
            TAGS="$(list_tags "/users/${OWNER}/packages/container/${PKG}/versions")"
          fi

          PREV="$(printf '%s\n' "${TAGS}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [ -z "${PREV}" ]; then
            NEXT="1.0.0"
            PREV_DISPLAY="none"
          else
            IFS=. read -r MAJ MIN PAT <<< "${PREV}"
            NEXT="${MAJ}.${MIN}.$((PAT + 1))"
            PREV_DISPLAY="${PREV}"
          fi

          echo "previous_version=${PREV_DISPLAY}" >> "$GITHUB_OUTPUT"
          echo "image_version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Resolved GHCR image version: previous=${PREV_DISPLAY} next=${NEXT}"
          {
            echo "### GHCR image version"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${PKG}\` |"
            echo "| Previous semver | \`${PREV_DISPLAY}\` |"
            echo "| Next semver | \`${NEXT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify and stage release package (WAR)
        id: package
        working-directory: ${{ env.APP_PATH }}
        env:
          # Bind github context for use in shell (Semgrep: no github context in run scripts)
          GH_RUN_NUMBER: ${{ github.run_number }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VERSION: ${{ steps.image-version.outputs.image_version }}
          PREVIOUS_IMAGE_VERSION: ${{ steps.image-version.outputs.previous_version }}
        run: |
          set -euo pipefail
          VERSION="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          ARTIFACT_ID="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.artifactId)"
          PACKAGING="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.packaging)"
          SHORT_SHA="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          RUN_ID="${GH_RUN_NUMBER}"

          # Tomcat ROOT.war only. An executable JAR is not a servlet webapp.
          BUILD_FILE="$(find target -maxdepth 1 -type f -name '*.war' \
            ! -name '*-sources.war' ! -name '*-javadoc.war' | head -n 1 || true)"
          if [ -z "${BUILD_FILE}" ] || [ ! -f "${BUILD_FILE}" ]; then
            echo "::error::No deployable .war under target/. Release image is Tomcat + ROOT.war, not java -jar."
            ls -lah target/ || true
            exit 1
          fi
          if [ "${PACKAGING}" != "war" ]; then
            echo "::error::pom packaging is '${PACKAGING}'; Release requires packaging=war for Tomcat ROOT.war."
            exit 1
          fi

          EXT="${BUILD_FILE##*.}"
          if [ "${EXT}" != "war" ]; then
            echo "::error::Expected a .war for Tomcat ROOT.war, got: ${BUILD_FILE}"
            exit 1
          fi
          if ! jar tf "${BUILD_FILE}" | grep -q '^WEB-INF/'; then
            echo "::error::${BUILD_FILE} is not a Tomcat webapp (no WEB-INF/). Do not package an executable JAR as ROOT.war."
            jar tf "${BUILD_FILE}" | head -n 40 || true
            exit 1
          fi
          # Spring Boot loads application-prod.properties (hyphen) when SPRING_PROFILES_ACTIVE=prod.
          if ! jar tf "${BUILD_FILE}" | grep -qx 'WEB-INF/classes/application-prod.properties'; then
            if jar tf "${BUILD_FILE}" | grep -q 'application.prod.properties'; then
              echo "::error::Found application.prod.properties (dot). Spring Boot prod profile loads application-prod.properties (hyphen) from src/main/resources/."
            else
              echo "::error::WAR is missing WEB-INF/classes/application-prod.properties. Add src/main/resources/application-prod.properties (hyphen) for non-secret prod defaults."
            fi
            jar tf "${BUILD_FILE}" | grep -i 'application' || true
            exit 1
          fi
          echo "WAR contains application-prod.properties (Spring prod profile)."
          # Relative path for Docker COPY (build context = APP_PATH)
          BUILD_FILE_REL="${BUILD_FILE#./}"
          VERSIONED_NAME="heavy-rental-rest-api-v${VERSION}-build${RUN_ID}-${SHORT_SHA}.${EXT}"
          STABLE_NAME="heavy-rental-rest-api.${EXT}"
          VERSIONED_PATH="${GITHUB_WORKSPACE}/${VERSIONED_NAME}"
          STABLE_PATH="${GITHUB_WORKSPACE}/${STABLE_NAME}"

          cp "${BUILD_FILE}" "${VERSIONED_PATH}"
          cp "${BUILD_FILE}" "${STABLE_PATH}"

          # Fail packaging if staged WAR is empty or missing
          if [ ! -s "${VERSIONED_PATH}" ] || [ ! -s "${STABLE_PATH}" ]; then
            echo "::error::Staged release package is missing or empty"
            exit 1
          fi

          file "${VERSIONED_PATH}" || true
          ls -lh "${VERSIONED_PATH}" "${STABLE_PATH}" "${BUILD_FILE}"

          IMAGE_TAG="${IMAGE_VERSION}"
          if [ -z "${IMAGE_TAG}" ]; then
            echo "::error::Resolved image version is empty"
            exit 1
          fi
          # GHCR (and Docker Hub) require image repository path segments to be lowercase
          IMAGE_NAME_LC="${IMAGE_NAME,,}"
          OWNER_LC="${GH_REPOSITORY_OWNER,,}"
          IMAGE_LOCAL="${IMAGE_NAME_LC}:${IMAGE_TAG}"
          IMAGE_LOCAL_LATEST="${IMAGE_NAME_LC}:latest"
          IMAGE_REMOTE="ghcr.io/${OWNER_LC}/${IMAGE_NAME_LC}:${IMAGE_TAG}"
          IMAGE_REMOTE_LATEST="ghcr.io/${OWNER_LC}/${IMAGE_NAME_LC}:latest"
          IMAGE_TAR="heavy_rental_rest_api-${IMAGE_TAG}.tar.gz"

          {
            echo "version=${VERSION}"
            echo "artifact_id=${ARTIFACT_ID}"
            echo "packaging=${PACKAGING}"
            echo "ext=${EXT}"
            echo "short_sha=${SHORT_SHA}"
            echo "versioned_name=${VERSIONED_NAME}"
            echo "stable_name=${STABLE_NAME}"
            echo "build_file=${BUILD_FILE}"
            echo "build_file_rel=${BUILD_FILE_REL}"
            echo "image_tag=${IMAGE_TAG}"
            echo "previous_image_version=${PREVIOUS_IMAGE_VERSION}"
            echo "image_local=${IMAGE_LOCAL}"
            echo "image_local_latest=${IMAGE_LOCAL_LATEST}"
            echo "image_remote=${IMAGE_REMOTE}"
            echo "image_remote_latest=${IMAGE_REMOTE_LATEST}"
            echo "image_tar=${IMAGE_TAR}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload target WAR/JAR build outputs
        uses: actions/upload-artifact@v7
        with:
          name: rest-api-release-target
          path: |
            ${{ env.APP_PATH }}/target/*.war
            ${{ env.APP_PATH }}/target/*.jar
          retention-days: 14
          if-no-files-found: error

      - name: Upload versioned release package (WAR)
        uses: actions/upload-artifact@v7
        with:
          name: rest-api-release-package
          path: |
            ${{ github.workspace }}/${{ steps.package.outputs.versioned_name }}
            ${{ github.workspace }}/${{ steps.package.outputs.stable_name }}
          retention-days: 14
          if-no-files-found: error

      # -------------------------------------------------------------------
      # Docker image: always Tomcat + ROOT.war so any Docker Engine can run it.
      # An app Dockerfile (java -jar / fat JAR) is not the deploy image.
      # Runtime env comes from docker run -e / compose env_file, not ENV/ARG.
      # -------------------------------------------------------------------
      - name: Prepare Dockerfile for WAR image
        working-directory: ${{ env.APP_PATH }}
        env:
          TOMCAT_BASE_IMAGE: ${{ env.TOMCAT_BASE_IMAGE }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          APP_REPOSITORY: ${{ needs.integration.outputs.app_repository }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          VERSION: ${{ steps.package.outputs.version }}
          WAR_REL: ${{ steps.package.outputs.build_file_rel }}
        run: |
          set -euo pipefail
          if [ ! -f "${WAR_REL}" ]; then
            echo "::error::WAR for Docker build not found: ${WAR_REL}"
            exit 1
          fi
          case "${WAR_REL}" in
            *.war) ;;
            *)
              echo "::error::Docker image copies a WAR as ROOT.war. Refusing: ${WAR_REL}"
              exit 1
              ;;
          esac

          if [ -f .dockerignore ] && grep -Eiq '^[[:space:]]*(\./)?target(/|\*|/\*)?[[:space:]]*$' .dockerignore; then
            echo "::error::.dockerignore excludes target/; Release cannot COPY the WAR into Tomcat."
            cat .dockerignore
            exit 1
          fi

          if [ -f Dockerfile ]; then
            echo "Application Dockerfile present — moving aside. Release always builds Tomcat + ROOT.war for GHCR / Docker Desktop / compose."
            mv Dockerfile Dockerfile.app-repo
          fi

          echo "Generating Tomcat WAR Dockerfile (Spring Boot WAR → ${TOMCAT_BASE_IMAGE})"
          {
            echo "# Generated by rest-api release packaging (Spring Boot WAR → Tomcat)"
            echo "# Portable: docker run -p 8080:8080 -e SPRING_DATASOURCE_URL=… <image>"
            echo "# SPRING_PROFILES_ACTIVE=prod loads application-prod.properties from the WAR."
            echo "# Runtime env (compose env_file / docker -e — do not ENV/ARG these):"
            echo "#   Postgres: POSTGRES_HOST, POSTGRES_HOSTNAME, POSTGRES_PORT,"
            echo "#             POSTGRES_DATABASE, POSTGRES_DB, POSTGRES_USERNAME,"
            echo "#             POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_URL,"
            echo "#             SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,"
            echo "#             SPRING_DATASOURCE_PASSWORD"
            echo "#   Haystack: HAYSTACK_BASE_URL"
            echo "#   Stripe:   STRIPE_API_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PUBLISHABLE_KEY"
            echo "#   JWT:      APP_JWT_SECRET"
            echo "FROM ${TOMCAT_BASE_IMAGE}"
            echo "LABEL org.opencontainers.image.title=\"${IMAGE_NAME}\""
            echo "LABEL org.opencontainers.image.description=\"Heavy Rental Spring REST API (WAR on Tomcat)\""
            echo "LABEL org.opencontainers.image.source=\"https://github.com/${APP_REPOSITORY}\""
            echo "LABEL org.opencontainers.image.revision=\"${SHORT_SHA}\""
            echo "LABEL org.opencontainers.image.version=\"${VERSION}\""
            echo ""
            echo "ENV SPRING_PROFILES_ACTIVE=prod"
            echo ""
            echo "# Clear default Tomcat apps; deploy API as root context"
            echo "RUN rm -rf /usr/local/tomcat/webapps/*"
            echo ""
            echo "COPY ${WAR_REL} /usr/local/tomcat/webapps/ROOT.war"
            echo ""
            echo "EXPOSE 8080"
            echo 'CMD ["catalina.sh", "run"]'
          } > Dockerfile

          echo "==> Dockerfile"
          cat Dockerfile
          echo "==> WAR for image: ${WAR_REL} ($(wc -c < "${WAR_REL}") bytes)"

          PROD_PROPS=""
          if [ -f src/main/resources/application-prod.properties ]; then
            PROD_PROPS="src/main/resources/application-prod.properties"
          fi
          if [ -n "${PROD_PROPS}" ]; then
            # Concatenate the JDBC user:pass@ fragment so this script never contains a
            # complete jdbc://user:password@host string (CWE-798 SAST self-match).
            JDBC_EMBEDDED_CREDS='jdbc:postgresql://'
            JDBC_EMBEDDED_CREDS+='[^$][^[:space:]]*:[^$][^[:space:]]*@'
            if grep -Eiq "sk_live_|sk_test_|whsec_|change-me-to-a-long-random-secret-key|${JDBC_EMBEDDED_CREDS}" "${PROD_PROPS}"; then
              echo "::error::${PROD_PROPS} must not contain Stripe secrets, the default JWT, or a baked JDBC URL. Use \${ENV} or omit; SM injects secrets."
              exit 1
            fi
            if grep -Eq '^[[:space:]]*(app\.jwt\.secret|APP_JWT_SECRET|stripe\.api\.key|STRIPE_API_KEY|STRIPE_WEBHOOK_SECRET|spring\.datasource\.password|POSTGRES_PASSWORD)[[:space:]]*=' "${PROD_PROPS}"; then
              if ! grep -Eq '^[[:space:]]*(app\.jwt\.secret|APP_JWT_SECRET|stripe\.api\.key|STRIPE_API_KEY|STRIPE_WEBHOOK_SECRET|spring\.datasource\.password|POSTGRES_PASSWORD)[[:space:]]*=[[:space:]]*\$\{' "${PROD_PROPS}"; then
                echo "::error::${PROD_PROPS} assigns a secret without a \${ENV} placeholder. Leave secrets to heavy-rental/rest."
                exit 1
              fi
            fi
            echo "Scanned ${PROD_PROPS}: no baked secrets."
          fi

          if grep -Eiq '^[[:space:]]*(ENV|ARG)[[:space:]]+(POSTGRES_|SPRING_DATASOURCE_|SPRING_JPA_|HAYSTACK_|STRIPE_|APP_JWT_|REST_API_CLOUD_DB_|REST_API_DB_)' Dockerfile; then
            echo "::error::Dockerfile bakes Spring/DB/Stripe/JWT/CI-DB config (ENV/ARG). Externalize via compose env_file or docker -e."
            exit 1
          fi
          if grep -Eiq '^[[:space:]]*COPY[[:space:]]+[^[:space:]]*\.env' Dockerfile; then
            echo "::error::Dockerfile copies a .env file. Secrets belong in heavy-rental/rest (or docker -e) at deploy."
            exit 1
          fi

      - name: Build Docker image
        id: docker
        working-directory: ${{ env.APP_PATH }}
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_LOCAL: ${{ steps.package.outputs.image_local }}
          IMAGE_LOCAL_LATEST: ${{ steps.package.outputs.image_local_latest }}
          IMAGE_REMOTE: ${{ steps.package.outputs.image_remote }}
          IMAGE_REMOTE_LATEST: ${{ steps.package.outputs.image_remote_latest }}
        run: |
          set -euo pipefail
          # Enforce lowercase repository path (GHCR rejects mixed-case names)
          IMAGE_NAME_LC="${IMAGE_NAME,,}"
          OWNER_LC="${GH_REPOSITORY_OWNER,,}"
          IMAGE_LOCAL="${IMAGE_LOCAL,,}"
          IMAGE_LOCAL_LATEST="${IMAGE_LOCAL_LATEST,,}"
          IMAGE_REMOTE="${IMAGE_REMOTE,,}"
          IMAGE_REMOTE_LATEST="${IMAGE_REMOTE_LATEST,,}"

          # No --build-arg for POSTGRES_ / SPRING_DATASOURCE_ / HAYSTACK_ / STRIPE_ / APP_JWT_ / REST_API_*
          docker build \
            --pull \
            -t "${IMAGE_LOCAL}" \
            -t "${IMAGE_LOCAL_LATEST}" \
            -t "${IMAGE_REMOTE}" \
            -t "${IMAGE_REMOTE_LATEST}" \
            .

          echo "==> Images built"
          echo "Local:  ${IMAGE_LOCAL}"
          echo "GHCR:   ${IMAGE_REMOTE}"
          docker images "${IMAGE_NAME_LC}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}'
          docker images "ghcr.io/${OWNER_LC}/${IMAGE_NAME_LC}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' || true

          # Export every tag so docker load matches compose / Docker Desktop (local + GHCR + :latest).
          # Use the stable IMAGE_ARCHIVE name so DAST/Publish can find it without job outputs.
          TAR_PATH="${GITHUB_WORKSPACE}/${IMAGE_ARCHIVE}"
          docker save \
            "${IMAGE_LOCAL}" \
            "${IMAGE_LOCAL_LATEST}" \
            "${IMAGE_REMOTE}" \
            "${IMAGE_REMOTE_LATEST}" \
            | gzip -c > "${TAR_PATH}"
          ls -lh "${TAR_PATH}"
          if [ ! -s "${TAR_PATH}" ]; then
            echo "::error::Docker image tar is missing or empty: ${TAR_PATH}"
            exit 1
          fi

          {
            echo "IMAGE_LOCAL=${IMAGE_LOCAL}"
            echo "IMAGE_LOCAL_LATEST=${IMAGE_LOCAL_LATEST}"
            echo "IMAGE_REMOTE=${IMAGE_REMOTE}"
            echo "IMAGE_REMOTE_LATEST=${IMAGE_REMOTE_LATEST}"
            echo "IMAGE_TAG=${IMAGE_LOCAL##*:}"
          } > "${GITHUB_WORKSPACE}/${IMAGE_META}"
          echo "==> ${IMAGE_META}"
          cat "${GITHUB_WORKSPACE}/${IMAGE_META}"

          {
            echo "image_id=$(docker image inspect -f '{{.Id}}' "${IMAGE_LOCAL}")"
            echo "tar_path=${TAR_PATH}"
          } >> "$GITHUB_OUTPUT"

      - name: Prove image is deployable
        env:
          IMAGE_LOCAL: ${{ steps.package.outputs.image_local }}
        run: |
          set -euo pipefail
          IMAGE_LOCAL="${IMAGE_LOCAL,,}"
          NAME="rest-smoke-${GITHUB_RUN_ID:-$$}"

          ENV_JSON="$(docker image inspect -f '{{json .Config.Env}}' "${IMAGE_LOCAL}")"
          echo "Image Config.Env: ${ENV_JSON}"
          if printf '%s' "${ENV_JSON}" | grep -Eq '"POSTGRES_|"SPRING_DATASOURCE_|"SPRING_JPA_|"HAYSTACK_|"STRIPE_|"APP_JWT_|"REST_API_CLOUD_DB_|"REST_API_DB_'; then
            echo "::error::Image bakes Spring/DB/Stripe/JWT/CI-DB env. Inject via docker -e or compose env_file."
            exit 1
          fi
          if ! printf '%s' "${ENV_JSON}" | grep -q 'SPRING_PROFILES_ACTIVE=prod'; then
            echo "::error::Image must set SPRING_PROFILES_ACTIVE=prod so application-prod.properties is loaded."
            exit 1
          fi
          echo "SPRING_PROFILES_ACTIVE=prod is set (application-prod.properties)."

          EXPOSED="$(docker image inspect -f '{{json .Config.ExposedPorts}}' "${IMAGE_LOCAL}")"
          echo "Image ExposedPorts: ${EXPOSED}"
          if ! printf '%s' "${EXPOSED}" | grep -q '8080/tcp'; then
            echo "::error::Image does not EXPOSE 8080/tcp. docker run -p 8080:8080 and Academy compose require it."
            exit 1
          fi

          docker run --rm --entrypoint /bin/sh "${IMAGE_LOCAL}" -c \
            'test -f /usr/local/tomcat/webapps/ROOT.war && jar tf /usr/local/tomcat/webapps/ROOT.war | grep -q "^WEB-INF/"'
          echo "Image contains Tomcat ROOT.war with WEB-INF (Spring Boot webapp)"

          # Dummy values only — not REST_API_CLOUD_DB_*, not Vocareum, not Academy RDS.
          OUT="$(
            docker run --rm \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://sor.example.test:5432/heavy_rental \
              -e POSTGRES_HOST=sor.example.test \
              -e HAYSTACK_BASE_URL=http://haystack.example.test:8000 \
              -e STRIPE_PUBLISHABLE_KEY=pk_test_ci_dummy \
              -e APP_JWT_SECRET=ci-dummy-jwt-secret-at-least-32-chars \
              --entrypoint /bin/sh \
              "${IMAGE_LOCAL}" \
              -c 'printf "%s\n" "$SPRING_DATASOURCE_URL" "$POSTGRES_HOST" "$HAYSTACK_BASE_URL" "$STRIPE_PUBLISHABLE_KEY" "$APP_JWT_SECRET"'
          )"
          echo "${OUT}" | grep -qx 'jdbc:postgresql://sor.example.test:5432/heavy_rental'
          echo "${OUT}" | grep -qx 'sor.example.test'
          echo "${OUT}" | grep -qx 'http://haystack.example.test:8000'
          echo "${OUT}" | grep -qx 'pk_test_ci_dummy'
          echo "${OUT}" | grep -qx 'ci-dummy-jwt-secret-at-least-32-chars'
          echo "Dummy SPRING_DATASOURCE_URL / POSTGRES_HOST / HAYSTACK_BASE_URL / Stripe / JWT are visible at runtime."

          cleanup() { docker rm -f "${NAME}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "${NAME}" \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://sor.example.test:5432/heavy_rental \
            -e SPRING_DATASOURCE_USERNAME=ci \
            -e SPRING_DATASOURCE_PASSWORD=ci \
            -e POSTGRES_HOSTNAME=sor.example.test \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=heavy_rental \
            -e POSTGRES_USER=ci \
            -e POSTGRES_PASSWORD=ci \
            -e HAYSTACK_BASE_URL=http://haystack.example.test:8000 \
            -e STRIPE_API_KEY=ci-stripe-api-key \
            -e STRIPE_PUBLISHABLE_KEY=ci-stripe-publishable-key \
            -e STRIPE_WEBHOOK_SECRET=ci-stripe-webhook-secret \
            -e APP_JWT_SECRET=ci-dummy-jwt-secret-at-least-32-chars \
            -e APP_CORS_ALLOWED_ORIGINS=http://127.0.0.1:8080 \
            "${IMAGE_LOCAL}"
          ok=0
          for _ in $(seq 1 45); do
            if docker exec "${NAME}" bash -c 'echo >/dev/tcp/127.0.0.1/8080' >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::Tomcat did not bind :8080 (image is not runnable with docker run -p 8080:8080)."
            docker logs "${NAME}" || true
            exit 1
          fi
          echo "Tomcat accepted TCP on :8080; image is deployable on any Docker Engine (Desktop, compose, Academy)."

          {
            echo "### Deployable image"
            echo ""
            echo "Generated \`tomcat:10.1-jdk21-temurin\` + Spring Boot \`ROOT.war\` (WEB-INF present)."
            echo "No baked POSTGRES_/SPRING_DATASOURCE_/HAYSTACK_/STRIPE_/APP_JWT_/REST_API_* in Config.Env."
            echo "Dummy compose-style env is visible. \`EXPOSE 8080\`. Tomcat bound \`:8080\`, then the container was removed."
            echo "Run anywhere: \`docker run -p 8080:8080 -e SPRING_DATASOURCE_URL=… <image>\` (Docker Desktop, compose, or Academy)."
            echo "Academy CD injects \`heavy-rental/rest\`. \`spring-datasource.env\` is a workflow artifact only (not in the image)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Docker image archive
        uses: actions/upload-artifact@v7
        with:
          name: rest-api-release-docker-image
          path: |
            ${{ github.workspace }}/${{ env.IMAGE_ARCHIVE }}
            ${{ github.workspace }}/${{ env.IMAGE_META }}
          retention-days: 14
          if-no-files-found: error

      - name: Packaging summary
        env:
          APP_REPOSITORY: ${{ needs.integration.outputs.app_repository }}
          APP_REF: ${{ needs.integration.outputs.app_ref }}
          ARTIFACT_ID: ${{ steps.package.outputs.artifact_id }}
          VERSION: ${{ steps.package.outputs.version }}
          PACKAGING: ${{ steps.package.outputs.packaging }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          VERSIONED_NAME: ${{ steps.package.outputs.versioned_name }}
          STABLE_NAME: ${{ steps.package.outputs.stable_name }}
          IMAGE_LOCAL: ${{ steps.package.outputs.image_local }}
          IMAGE_REMOTE: ${{ steps.package.outputs.image_remote }}
          IMAGE_REMOTE_LATEST: ${{ steps.package.outputs.image_remote_latest }}
          IMAGE_TAR: ${{ steps.package.outputs.image_tar }}
          IMAGE_ID: ${{ steps.docker.outputs.image_id }}
          EXT: ${{ steps.package.outputs.ext }}
        run: |
          {
            echo "### Packaging complete (Spring Boot REST API)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Application | \`${APP_REPOSITORY}\` |"
            echo "| Ref | \`${APP_REF}\` |"
            echo "| ArtifactId | \`${ARTIFACT_ID}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Packaging | \`${PACKAGING}\` |"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo "| Versioned WAR | \`${VERSIONED_NAME}\` |"
            echo "| Stable WAR | \`${STABLE_NAME}\` |"
            echo "| Docker image (local) | \`${IMAGE_LOCAL}\` |"
            echo "| Docker image (GHCR) | \`${IMAGE_REMOTE}\` |"
            echo "| Docker image (GHCR latest) | \`${IMAGE_REMOTE_LATEST}\` |"
            echo "| Image archive | \`${IMAGE_ARCHIVE}\` |"
            echo "| Image ID | \`${IMAGE_ID}\` |"
            echo "| Artifacts | \`rest-api-release-target\`, \`rest-api-release-package\`, \`rest-api-release-docker-image\` |"
            echo ""
            echo "### Deploy options"
            echo ""
            echo "1. **WAR** — download \`rest-api-release-package\` and deploy the \`.war\` as Tomcat \`ROOT.war\`."
            echo "2. **Image archive** — \`gzip -dc ${IMAGE_ARCHIVE} | docker load\` then \`docker run -p 8080:8080 -e … ${IMAGE_LOCAL}\` (Docker Desktop or any Engine)."
            echo "3. **GHCR** — Publish (next jobs) pushes \`${IMAGE_REMOTE}\` and \`${IMAGE_REMOTE_LATEST}\` after DAST. This job only uploads the tar."
          } >> "$GITHUB_STEP_SUMMARY"

  dast:
    name: DAST
    runs-on: ubuntu-latest
    needs: [packaging]
    timeout-minutes: 40
    steps:
      - name: Download Docker image archive
        uses: actions/download-artifact@v8
        with:
          name: rest-api-release-docker-image
          path: ${{ github.workspace }}

      - name: Load image and start target
        id: start-dast
        run: |
          set -euo pipefail
          # Do not use needs.packaging.outputs here: packaging sets environment:
          # production, and those job outputs are empty in this reusable workflow.
          META="${GITHUB_WORKSPACE}/${IMAGE_META}"
          ARCHIVE="${GITHUB_WORKSPACE}/${IMAGE_ARCHIVE}"
          if [ -f "${META}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${META}"
            set +a
          fi
          if [ ! -f "${ARCHIVE}" ]; then
            ARCHIVE="$(find "${GITHUB_WORKSPACE}" -maxdepth 2 -type f -name '*.tar.gz' | head -n 1 || true)"
          fi
          if [ -z "${ARCHIVE}" ] || [ ! -f "${ARCHIVE}" ]; then
            echo "::error::Docker image archive not found after downloading rest-api-release-docker-image."
            echo "Expected ${GITHUB_WORKSPACE}/${IMAGE_ARCHIVE} (and ${IMAGE_META})."
            ls -la "${GITHUB_WORKSPACE}" || true
            find "${GITHUB_WORKSPACE}" -maxdepth 2 -type f | head -n 50 || true
            exit 1
          fi
          echo "Loading ${ARCHIVE} ($(wc -c < "${ARCHIVE}") bytes)"
          gzip -dc "${ARCHIVE}" | docker load
          docker images
          if [ -z "${IMAGE_LOCAL:-}" ]; then
            IMAGE_LOCAL="$(docker images --format '{{.Repository}}:{{.Tag}}' "${IMAGE_NAME}" \
              | grep -vE ':(latest|<none>)$' | head -n 1 || true)"
          fi
          if [ -z "${IMAGE_LOCAL:-}" ]; then
            echo "::error::Could not determine IMAGE_LOCAL after docker load. ${IMAGE_META} missing?"
            exit 1
          fi
          IMAGE_LOCAL="${IMAGE_LOCAL,,}"
          echo "Using IMAGE_LOCAL=${IMAGE_LOCAL}"

          docker network inspect dastnet >/dev/null 2>&1 || docker network create dastnet
          docker rm -f dast-db dast-app >/dev/null 2>&1 || true
          docker run -d --name dast-db --network dastnet --network-alias dast-db \
            -e POSTGRES_DB=heavy_rental \
            -e POSTGRES_USER=dast \
            -e POSTGRES_PASSWORD=dast \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec dast-db pg_isready -U dast >/dev/null 2>&1; then
              echo "DAST Postgres is ready."
              break
            fi
            if [ "${i}" -eq 30 ]; then
              echo "::error::DAST Postgres did not become ready."
              docker logs dast-db || true
              exit 1
            fi
            sleep 2
          done

          docker run -d --name dast-app --network dastnet --network-alias dast-app \
            -p 8080:8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://dast-db:5432/heavy_rental \
            -e SPRING_DATASOURCE_USERNAME=dast \
            -e SPRING_DATASOURCE_PASSWORD=dast \
            -e POSTGRES_HOSTNAME=dast-db \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=heavy_rental \
            -e POSTGRES_USER=dast \
            -e POSTGRES_PASSWORD=dast \
            -e HAYSTACK_BASE_URL=http://haystack.example.test:8000 \
            -e STRIPE_API_KEY=ci-stripe-api-key \
            -e STRIPE_PUBLISHABLE_KEY=ci-stripe-publishable-key \
            -e STRIPE_WEBHOOK_SECRET=ci-stripe-webhook-secret \
            -e APP_JWT_SECRET=ci-dummy-jwt-secret-at-least-32-chars \
            -e APP_CORS_ALLOWED_ORIGINS=http://127.0.0.1:8080 \
            "${IMAGE_LOCAL}"
          ok=0
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null --max-time 3 "http://127.0.0.1:8080/actuator/health"; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::DAST target did not become ready on :8080."
            docker logs dast-app || true
            docker logs dast-db || true
            exit 1
          fi
          echo "DAST target is up at http://dast-app:8080 (also http://127.0.0.1:8080)"

      - name: Prepare DAST reports directory
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/dast-reports"
          chmod 777 "${GITHUB_WORKSPACE}/dast-reports"

      - name: OWASP ZAP baseline
        if: ${{ always() && steps.start-dast.outcome == 'success' }}
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          chmod 777 "${REPORTS}"
          set +e
          docker run --rm --network dastnet \
            -v "${REPORTS}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "http://dast-app:8080" -J zap.json -r zap.html -w zap.md -I
          ZAP_RC=$?
          set -e
          echo "ZAP exit=${ZAP_RC} (0=pass, 1=warn, 2=fail)"
          ls -la "${REPORTS}" || true
          for f in zap.json zap.html zap.md; do
            if [ ! -s "${REPORTS}/${f}" ]; then
              echo "ZAP did not write ${f} (exit=${ZAP_RC})" > "${REPORTS}/${f}"
            fi
          done
          if [ "${ZAP_RC}" -ge 2 ]; then
            echo "::error::OWASP ZAP baseline failed (high-severity findings or scan error)."
            exit "${ZAP_RC}"
          fi

      - name: Dastardly
        if: ${{ always() && steps.start-dast.outcome == 'success' }}
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          chmod 777 "${REPORTS}"
          set +e
          docker run --rm --network dastnet \
            -v "${REPORTS}:/dastardly" \
            -e DASTARDLY_TARGET_URL="http://dast-app:8080" \
            -e DASTARDLY_OUTPUT_FILE=/dastardly/dastardly-report.xml \
            public.ecr.aws/portswigger/dastardly:latest
          DAST_RC=$?
          set -e
          echo "Dastardly exit=${DAST_RC}"
          ls -la "${REPORTS}" || true
          if [ ! -s "${REPORTS}/dastardly-report.xml" ]; then
            printf '%s\n' '<testsuites name="dastardly"/>' > "${REPORTS}/dastardly-report.xml"
          fi
          if [ "${DAST_RC}" -ne 0 ]; then
            echo "::error::Dastardly reported high-severity findings (or the scan failed)."
            exit "${DAST_RC}"
          fi

      - name: Nuclei (report-only)
        if: ${{ always() && steps.start-dast.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          chmod 777 "${REPORTS}"
          docker run --rm --network dastnet \
            -v "${REPORTS}:/out" \
            projectdiscovery/nuclei:latest \
            -u "http://dast-app:8080" -silent -jsonl -o /out/nuclei.jsonl || true
          if [ ! -f "${REPORTS}/nuclei.jsonl" ]; then
            touch "${REPORTS}/nuclei.jsonl"
          fi

      # Combined human-readable DAST PDF. Keep in sync with
      # heavy-rental-project-pipeline-development/scripts/combine-dast-report.py
      # Download: Summary → Artifacts (`dast-combined-report-pdf`), job summary link,
      # or the GitHub Release asset.
      - name: Install reportlab (combined DAST PDF)
        if: always()
        run: pip install --quiet reportlab

      - name: Combine DAST reports into PDF
        if: always()
        env:
          COMBINED_PDF_TITLE: Heavy Rental REST API — Combined DAST report
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORT_DIR}"
          cat > "${REPORT_DIR}/combine-dast-report.py" << 'COMBINE_DAST_REPORT_PY'
          #!/usr/bin/env python3
          """Combine Release DAST tool outputs into one PDF.
          
          Keep this file in sync with the heredoc in each Release CI
          ``release-pipeline.yml`` DAST job.
          
          Supported inputs (all optional):
            - zap.json (OWASP ZAP baseline)
            - dastardly-report.xml (Dastardly JUnit XML)
            - nuclei.jsonl (Nuclei)
            - mobsf-report.json (MobSF)
          
          Request bodies, ZAP evidence, and SARIF-style snippets are never copied
          into the PDF (scanner hits can echo credentials).
          """
          
          from __future__ import annotations
          
          import argparse
          import json
          import re
          import sys
          from collections import Counter
          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from pathlib import Path
          from xml.etree import ElementTree
          from xml.sax.saxutils import escape as xml_escape
          
          from reportlab.lib import colors
          from reportlab.lib.pagesizes import letter
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import inch
          from reportlab.platypus import (
              PageBreak,
              Paragraph,
              SimpleDocTemplate,
              Spacer,
              Table,
              TableStyle,
          )
          
          MAX_MESSAGE = 400
          MAX_FINDINGS_PER_TOOL = 200
          SKIP_NAMES = {
              "combined-dast-report.pdf",
              "combine-dast-report.py",
              "INDEX.md",
              "zap.html",
              "zap.md",
              "mobsf-upload.json",
              "mobsf-scan.json",
              "mobsf-report.pdf",
          }
          HTML_TAG_RE = re.compile(r"<[^>]+>")
          ZAP_RISK = {"0": "info", "1": "low", "2": "medium", "3": "high", "4": "critical"}
          
          
          @dataclass
          class Finding:
              rule_id: str
              level: str
              location: str
              message: str
          
          
          @dataclass
          class ToolReport:
              name: str
              source_file: str
              present: bool
              findings: list[Finding] = field(default_factory=list)
              note: str = ""
          
          
          def pdf_safe(text: str) -> str:
              raw = "" if text is None else str(text)
              raw = raw.replace("\r\n", "\n").replace("\r", "\n")
              raw = raw.encode("latin-1", "replace").decode("latin-1")
              return xml_escape(raw)
          
          
          def truncate(text: str, limit: int = MAX_MESSAGE) -> str:
              text = " ".join((text or "").split())
              if len(text) <= limit:
                  return text
              return text[: limit - 1] + "…"
          
          
          def strip_html(text: str) -> str:
              return HTML_TAG_RE.sub(" ", text or "")
          
          
          def _unreadable(path: Path, name: str, exc: Exception) -> ToolReport:
              return ToolReport(
                  name=name,
                  source_file=path.name,
                  present=True,
                  note=f"Could not parse {path.name}: {exc}",
              )
          
          
          def _placeholder_note(path: Path, prefix: str) -> str | None:
              try:
                  text = path.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  return None
              stripped = text.strip()
              if stripped.startswith(prefix) or stripped.startswith("ZAP did not write"):
                  return truncate(stripped, 200)
              return None
          
          
          def parse_zap(path: Path) -> ToolReport:
              note = _placeholder_note(path, "ZAP did not write")
              if note:
                  return ToolReport(name="OWASP ZAP", source_file=path.name, present=True, note=note)
              try:
                  data = json.loads(path.read_text(encoding="utf-8") or "{}")
              except (OSError, json.JSONDecodeError) as exc:
                  return _unreadable(path, "OWASP ZAP", exc)
              if not isinstance(data, dict):
                  return ToolReport(
                      name="OWASP ZAP",
                      source_file=path.name,
                      present=True,
                      note="ZAP JSON was not an object.",
                  )
              findings: list[Finding] = []
              for site in data.get("site") or []:
                  if not isinstance(site, dict):
                      continue
                  site_name = site.get("@name") or site.get("name") or ""
                  for alert in site.get("alerts") or []:
                      if not isinstance(alert, dict):
                          continue
                      riskcode = str(alert.get("riskcode") or "")
                      level = (alert.get("riskdesc") or ZAP_RISK.get(riskcode) or "warning").split()[0].lower()
                      name = alert.get("alert") or alert.get("name") or "alert"
                      instances = alert.get("instances") or []
                      uri = site_name or "—"
                      if instances and isinstance(instances[0], dict):
                          uri = instances[0].get("uri") or uri
                      desc = truncate(strip_html(str(alert.get("desc") or "")))
                      findings.append(
                          Finding(
                              rule_id=str(alert.get("pluginid") or alert.get("alertRef") or name),
                              level=level or "warning",
                              location=str(uri),
                              message=desc or truncate(str(name)),
                          )
                      )
              return ToolReport(name="OWASP ZAP", source_file=path.name, present=True, findings=findings)
          
          
          def parse_dastardly(path: Path) -> ToolReport:
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError as exc:
                  return _unreadable(path, "Dastardly", exc)
              stripped = text.strip()
              if stripped in {"<testsuites name=\"dastardly\"/>", "<testsuites name='dastardly'/>"}:
                  return ToolReport(
                      name="Dastardly",
                      source_file=path.name,
                      present=True,
                      note="Placeholder empty Dastardly report (scanner did not write XML).",
                  )
              try:
                  root = ElementTree.fromstring(text)
              except ElementTree.ParseError as exc:
                  return _unreadable(path, "Dastardly", exc)
              findings: list[Finding] = []
              for case in root.iter("testcase"):
                  name = case.get("name") or case.get("classname") or "testcase"
                  location = case.get("classname") or "—"
                  for child in list(case):
                      tag = child.tag.split("}", 1)[-1]
                      if tag not in {"failure", "error"}:
                          continue
                      msg = child.get("message") or ""
                      findings.append(
                          Finding(
                              rule_id=str(name),
                              level="high" if tag == "failure" else "error",
                              location=str(location),
                              message=truncate(msg or (child.text or tag)),
                          )
                      )
              return ToolReport(name="Dastardly", source_file=path.name, present=True, findings=findings)
          
          
          def parse_nuclei(path: Path) -> ToolReport:
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError as exc:
                  return _unreadable(path, "Nuclei", exc)
              findings: list[Finding] = []
              notes: list[str] = []
              for line_no, raw in enumerate(text.splitlines(), start=1):
                  line = raw.strip()
                  if not line:
                      continue
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError as exc:
                      notes.append(f"line {line_no}: {exc}")
                      continue
                  if not isinstance(row, dict):
                      continue
                  info = row.get("info") if isinstance(row.get("info"), dict) else {}
                  name = info.get("name") or row.get("template-id") or row.get("template_id") or "nuclei"
                  level = str(info.get("severity") or "info").lower()
                  location = str(row.get("matched-at") or row.get("matched_at") or row.get("host") or "—")
                  desc = info.get("description") or name
                  findings.append(
                      Finding(
                          rule_id=str(row.get("template-id") or row.get("template_id") or name),
                          level=level,
                          location=location,
                          message=truncate(str(desc)),
                      )
                  )
              note = ""
              if notes:
                  note = truncate("; ".join(notes[:5]))
              return ToolReport(
                  name="Nuclei",
                  source_file=path.name,
                  present=True,
                  findings=findings,
                  note=note,
              )
          
          
          def _mobsf_finding(rule_id: str, level: str, location: str, message: str) -> Finding:
              return Finding(
                  rule_id=truncate(str(rule_id), 80),
                  level=(level or "warning").lower(),
                  location=truncate(str(location or "—"), 120),
                  message=truncate(str(message)),
              )
          
          
          def _walk_mobsf_list(items: object, default_level: str, location: str) -> list[Finding]:
              findings: list[Finding] = []
              if not isinstance(items, list):
                  return findings
              for item in items:
                  if isinstance(item, str):
                      findings.append(_mobsf_finding(item, default_level, location, item))
                  elif isinstance(item, (list, tuple)) and item:
                      level = default_level
                      msg = item[-1] if len(item) > 1 else item[0]
                      if len(item) >= 2 and isinstance(item[0], str):
                          level = str(item[0])
                      rule = item[1] if len(item) > 1 else item[0]
                      findings.append(_mobsf_finding(str(rule), level, location, str(msg)))
                  elif isinstance(item, dict):
                      level = str(
                          item.get("severity")
                          or item.get("level")
                          or item.get("stat")
                          or default_level
                      )
                      title = item.get("title") or item.get("rule") or item.get("name") or "finding"
                      desc = item.get("description") or item.get("desc") or title
                      loc = item.get("file") or item.get("path") or location
                      findings.append(_mobsf_finding(str(title), level, str(loc), str(desc)))
              return findings
          
          
          def parse_mobsf(path: Path) -> ToolReport:
              try:
                  data = json.loads(path.read_text(encoding="utf-8") or "{}")
              except (OSError, json.JSONDecodeError) as exc:
                  return _unreadable(path, "MobSF", exc)
              if not isinstance(data, dict):
                  return ToolReport(
                      name="MobSF",
                      source_file=path.name,
                      present=True,
                      note="MobSF JSON was not an object.",
                  )
              if data.get("error") and len(data) <= 2:
                  return ToolReport(
                      name="MobSF",
                      source_file=path.name,
                      present=True,
                      note=truncate(str(data.get("error"))),
                  )
              findings: list[Finding] = []
              for key, level in (("high", "high"), ("warning", "warning"), ("info", "info")):
                  findings.extend(_walk_mobsf_list(data.get(key), level, key))
              cert = data.get("certificate_analysis")
              if isinstance(cert, dict):
                  findings.extend(
                      _walk_mobsf_list(cert.get("certificate_findings"), "warning", "certificate")
                  )
              manifest = data.get("manifest_analysis")
              if isinstance(manifest, dict):
                  findings.extend(
                      _walk_mobsf_list(manifest.get("manifest_findings"), "warning", "manifest")
                  )
              network = data.get("network_security")
              if isinstance(network, dict):
                  findings.extend(
                      _walk_mobsf_list(network.get("network_findings"), "warning", "network")
                  )
              code = data.get("code_analysis")
              if isinstance(code, dict):
                  code_findings = code.get("findings")
                  if isinstance(code_findings, dict):
                      for rule_id, body in code_findings.items():
                          if not isinstance(body, dict):
                              continue
                          meta = body.get("metadata") if isinstance(body.get("metadata"), dict) else {}
                          level = str(meta.get("severity") or "info")
                          desc = meta.get("description") or rule_id
                          files = body.get("files")
                          loc = "code"
                          if isinstance(files, dict) and files:
                              loc = next(iter(files))
                          findings.append(_mobsf_finding(str(rule_id), level, str(loc), str(desc)))
              return ToolReport(name="MobSF", source_file=path.name, present=True, findings=findings)
          
          
          PARSERS = {
              "zap.json": parse_zap,
              "dastardly-report.xml": parse_dastardly,
              "nuclei.jsonl": parse_nuclei,
              "mobsf-report.json": parse_mobsf,
          }
          
          
          def collect_reports(input_dir: Path) -> list[ToolReport]:
              reports: list[ToolReport] = []
              if not input_dir.is_dir():
                  return reports
              for filename, parser in PARSERS.items():
                  path = input_dir / filename
                  if path.is_file():
                      reports.append(parser(path))
              return reports
          
          
          def level_counts(findings: list[Finding]) -> str:
              counts = Counter(f.level for f in findings)
              if not findings:
                  return "0"
              order = ["critical", "high", "medium", "low", "error", "warning", "info", "note", "none"]
              parts = [f"{lvl}={counts[lvl]}" for lvl in order if counts.get(lvl)]
              extra = sorted(k for k in counts if k not in order)
              parts.extend(f"{lvl}={counts[lvl]}" for lvl in extra)
              return f"{len(findings)} ({', '.join(parts)})"
          
          
          def _styles() -> dict:
              styles = getSampleStyleSheet()
              styles.add(
                  ParagraphStyle(
                      name="Meta",
                      parent=styles["Normal"],
                      fontName="Helvetica",
                      fontSize=9,
                      leading=12,
                      textColor=colors.HexColor("#333333"),
                  )
              )
              styles.add(
                  ParagraphStyle(
                      name="Cell",
                      parent=styles["Normal"],
                      fontName="Helvetica",
                      fontSize=8,
                      leading=10,
                  )
              )
              styles.add(
                  ParagraphStyle(
                      name="CellHead",
                      parent=styles["Normal"],
                      fontName="Helvetica-Bold",
                      fontSize=8,
                      leading=10,
                  )
              )
              return styles
          
          
          def _table(rows: list[list], col_widths: list[float]) -> Table:
              table = Table(rows, colWidths=col_widths, repeatRows=1)
              table.setStyle(
                  TableStyle(
                      [
                          ("GRID", (0, 0), (-1, -1), 0.4, colors.grey),
                          ("BACKGROUND", (0, 0), (-1, 0), colors.HexColor("#e8eef4")),
                          ("VALIGN", (0, 0), (-1, -1), "TOP"),
                          ("LEFTPADDING", (0, 0), (-1, -1), 4),
                          ("RIGHTPADDING", (0, 0), (-1, -1), 4),
                          ("TOPPADDING", (0, 0), (-1, -1), 3),
                          ("BOTTOMPADDING", (0, 0), (-1, -1), 3),
                      ]
                  )
              )
              return table
          
          
          def build_story(reports: list[ToolReport], args: argparse.Namespace) -> list:
              styles = _styles()
              cell, head = styles["Cell"], styles["CellHead"]
              story: list = [
                  Paragraph(pdf_safe(args.title), styles["Title"]),
                  Spacer(1, 8),
                  Paragraph(f"<b>Repository:</b> {pdf_safe(args.repo)}", styles["Meta"]),
                  Paragraph(f"<b>Commit:</b> {pdf_safe(args.sha)}", styles["Meta"]),
                  Paragraph(f"<b>Workflow run:</b> {pdf_safe(args.run_url)}", styles["Meta"]),
                  Paragraph(
                      f"<b>Generated (UTC):</b> {pdf_safe(datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%SZ'))}",
                      styles["Meta"],
                  ),
                  Paragraph(
                      "Machine-readable DAST outputs remain in this artifact (ZAP JSON/HTML, "
                      "Dastardly XML, Nuclei JSONL, MobSF JSON). This PDF is a human download. "
                      "Request bodies and scanner evidence snippets are omitted.",
                      styles["Meta"],
                  ),
                  Spacer(1, 14),
                  Paragraph("Summary", styles["Heading1"]),
              ]
              usable = 7.5 * inch
              if not reports:
                  story.append(Paragraph("No DAST scanner outputs were produced in dast-reports/.", styles["Normal"]))
                  return story
          
              summary_rows = [[
                  Paragraph("Tool", head),
                  Paragraph("File", head),
                  Paragraph("Present", head),
                  Paragraph("Findings", head),
              ]]
              for report in reports:
                  summary_rows.append([
                      Paragraph(pdf_safe(report.name), cell),
                      Paragraph(pdf_safe(report.source_file), cell),
                      Paragraph("yes" if report.present else "no", cell),
                      Paragraph(pdf_safe(level_counts(report.findings)), cell),
                  ])
              story.append(_table(summary_rows, [1.6 * inch, 2.0 * inch, 0.8 * inch, usable - 4.4 * inch]))
              story.append(Spacer(1, 12))
          
              for index, report in enumerate(reports):
                  if index:
                      story.append(PageBreak())
                  story.append(Paragraph(pdf_safe(f"{report.name} ({report.source_file})"), styles["Heading1"]))
                  if report.note:
                      story.append(Paragraph(pdf_safe(report.note), styles["Normal"]))
                  if not report.findings:
                      story.append(Paragraph("No findings in this report.", styles["Normal"]))
                      continue
                  shown = report.findings[:MAX_FINDINGS_PER_TOOL]
                  omitted = len(report.findings) - len(shown)
                  rows = [[
                      Paragraph("Level", head),
                      Paragraph("Rule", head),
                      Paragraph("Location", head),
                      Paragraph("Message", head),
                  ]]
                  for finding in shown:
                      rows.append([
                          Paragraph(pdf_safe(finding.level), cell),
                          Paragraph(pdf_safe(finding.rule_id), cell),
                          Paragraph(pdf_safe(finding.location), cell),
                          Paragraph(pdf_safe(finding.message).replace("\n", "<br/>"), cell),
                      ])
                  story.append(
                      _table(rows, [0.8 * inch, 1.6 * inch, 2.0 * inch, usable - 4.4 * inch])
                  )
                  if omitted > 0:
                      story.append(Spacer(1, 6))
                      story.append(
                          Paragraph(pdf_safe(f"… and {omitted} more finding(s) not listed."), styles["Meta"])
                      )
              return story
          
          
          def add_page_number(canvas, doc) -> None:
              canvas.saveState()
              canvas.setFont("Helvetica", 8)
              canvas.setFillColor(colors.HexColor("#555555"))
              canvas.drawString(0.75 * inch, 0.45 * inch, "Combined DAST report")
              canvas.drawRightString(letter[0] - 0.75 * inch, 0.45 * inch, f"Page {doc.page}")
              canvas.restoreState()
          
          
          def write_pdf(reports: list[ToolReport], args: argparse.Namespace) -> None:
              output = Path(args.output)
              output.parent.mkdir(parents=True, exist_ok=True)
              doc = SimpleDocTemplate(
                  str(output),
                  pagesize=letter,
                  leftMargin=0.75 * inch,
                  rightMargin=0.75 * inch,
                  topMargin=0.7 * inch,
                  bottomMargin=0.7 * inch,
                  title=args.title,
                  author="Heavy Rental Release CI",
              )
              doc.build(build_story(reports, args), onFirstPage=add_page_number, onLaterPages=add_page_number)
          
          
          def parse_args(argv: list[str] | None = None) -> argparse.Namespace:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--input-dir", required=True)
              parser.add_argument("--output", required=True)
              parser.add_argument("--title", default="Combined DAST report")
              parser.add_argument("--repo", default="")
              parser.add_argument("--sha", default="")
              parser.add_argument("--run-url", default="")
              return parser.parse_args(argv)
          
          
          def main(argv: list[str] | None = None) -> int:
              args = parse_args(argv)
              reports = collect_reports(Path(args.input_dir))
              write_pdf(reports, args)
              output = Path(args.output)
              if not output.is_file() or output.stat().st_size == 0:
                  print(f"error: PDF was not written: {output}", file=sys.stderr)
                  return 1
              print(f"Wrote {output} ({output.stat().st_size} bytes, {len(reports)} report(s))")
              return 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          COMBINE_DAST_REPORT_PY
          python3 "${REPORT_DIR}/combine-dast-report.py" \
            --input-dir "${REPORT_DIR}" \
            --output "${REPORT_DIR}/combined-dast-report.pdf" \
            --title "${COMBINED_PDF_TITLE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test -s "${REPORT_DIR}/combined-dast-report.pdf"

      - name: Upload combined DAST report (PDF)
        if: always() && hashFiles('dast-reports/combined-dast-report.pdf') != ''
        id: upload-dast-pdf
        uses: actions/upload-artifact@v7
        with:
          name: dast-combined-report-pdf
          path: dast-reports/combined-dast-report.pdf
          retention-days: 30
          if-no-files-found: warn

      - name: Publish DAST PDF download
        if: always() && steps.upload-dast-pdf.outputs.artifact-url != ''
        env:
          PDF_URL: ${{ steps.upload-dast-pdf.outputs.artifact-url }}
        run: |
          {
            echo "### Combined DAST report (PDF)"
            echo ""
            echo "Download: [combined-dast-report.pdf](${PDF_URL})"
            echo ""
            echo "Artifact: \`dast-combined-report-pdf\` (also inside the DAST reports artifact)."
            echo "On this run: Summary → Artifacts. Also attached to the GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Index DAST reports
        if: always()
        run: |
          set -euo pipefail
          REPORTS="${GITHUB_WORKSPACE}/dast-reports"
          mkdir -p "${REPORTS}"
          {
            echo "# DAST reports"
            echo ""
            echo "| File | Bytes |"
            echo "| --- | --- |"
            find "${REPORTS}" -maxdepth 1 -type f ! -name INDEX.md -print | sort | while read -r f; do
              echo "| \`$(basename "$f")\` | $(wc -c < "$f") |"
            done
          } | tee "${REPORTS}/INDEX.md"
          cat "${REPORTS}/INDEX.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop DAST target
        if: always()
        run: |
          docker rm -f dast-app dast-db >/dev/null 2>&1 || true
          docker network rm dastnet >/dev/null 2>&1 || true

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rest-api-release-dast
          path: ${{ github.workspace }}/dast-reports/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [integration, packaging, dast]
    timeout-minutes: 20
    steps:
      - name: Download Docker image archive
        uses: actions/download-artifact@v8
        with:
          name: rest-api-release-docker-image
          path: ${{ github.workspace }}

      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: rest-api-release-package
          path: ${{ github.workspace }}/release-package

      - name: Download DAST reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: rest-api-release-dast
          path: ${{ github.workspace }}/release-dast

      - name: Load image
        run: |
          set -euo pipefail
          META="${GITHUB_WORKSPACE}/${IMAGE_META}"
          ARCHIVE="${GITHUB_WORKSPACE}/${IMAGE_ARCHIVE}"
          if [ -f "${META}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${META}"
            set +a
          fi
          if [ ! -f "${ARCHIVE}" ]; then
            ARCHIVE="$(find "${GITHUB_WORKSPACE}" -maxdepth 2 -type f -name '*.tar.gz' | head -n 1 || true)"
          fi
          if [ -z "${ARCHIVE}" ] || [ ! -f "${ARCHIVE}" ]; then
            echo "::error::Docker image archive not found after downloading rest-api-release-docker-image."
            ls -la "${GITHUB_WORKSPACE}" || true
            exit 1
          fi
          echo "Loading ${ARCHIVE} ($(wc -c < "${ARCHIVE}") bytes)"
          gzip -dc "${ARCHIVE}" | docker load
          docker images

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR and set public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          META="${GITHUB_WORKSPACE}/${IMAGE_META}"
          if [ -f "${META}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${META}"
            set +a
          fi
          if [ -z "${IMAGE_REMOTE:-}" ] || [ -z "${IMAGE_REMOTE_LATEST:-}" ] || [ -z "${IMAGE_TAG:-}" ]; then
            echo "::error::IMAGE_REMOTE/IMAGE_TAG missing. Expected ${IMAGE_META} in rest-api-release-docker-image."
            cat "${META}" || true
            exit 1
          fi
          IMAGE_REMOTE="${IMAGE_REMOTE,,}"
          IMAGE_REMOTE_LATEST="${IMAGE_REMOTE_LATEST,,}"
          OWNER="${GH_REPOSITORY_OWNER}"
          PKG="${IMAGE_NAME,,}"

          list_tags() {
            local path="$1"
            gh api --paginate "${path}" --jq '.[] | .metadata.container.tags[]?' 2>/dev/null || true
          }

          TAGS="$(list_tags "/orgs/${OWNER}/packages/container/${PKG}/versions")"
          if [ -z "${TAGS}" ]; then
            TAGS="$(list_tags "/users/${OWNER}/packages/container/${PKG}/versions")"
          fi
          if printf '%s\n' "${TAGS}" | grep -qx "${IMAGE_TAG}"; then
            echo "::error::GHCR tag ${IMAGE_REMOTE} already exists; will not overwrite a version tag."
            exit 1
          fi

          docker push "${IMAGE_REMOTE}"
          docker push "${IMAGE_REMOTE_LATEST}"
          echo "Pushed ${IMAGE_REMOTE} and ${IMAGE_REMOTE_LATEST}"

          # GitHub has no public REST endpoint to change package visibility
          # (POST .../visibility is not in the Packages API and returns 404).
          # Read current visibility; if it is already public, continue. Otherwise
          # warn with the UI path and do not fail — the image is already on GHCR.
          PKG_HTML="https://github.com/orgs/${OWNER}/packages/container/${PKG}/settings"
          VISIBILITY=""
          set +e
          VISIBILITY="$(gh api "/orgs/${OWNER}/packages/container/${PKG}" --jq '.visibility' 2>/dev/null)"
          if [ -z "${VISIBILITY}" ]; then
            VISIBILITY="$(gh api "/users/${OWNER}/packages/container/${PKG}" --jq '.visibility' 2>/dev/null)"
            PKG_HTML="https://github.com/users/${OWNER}/packages/container/${PKG}/settings"
          fi
          set -e
          if [ "${VISIBILITY}" = "public" ]; then
            echo "GHCR package ${PKG} is already public."
          else
            echo "::warning::GHCR package '${PKG}' visibility is '${VISIBILITY:-unknown}'. GITHUB_TOKEN cannot change it (no Packages visibility API). Image tags were still pushed."
            echo "Make it public once (org owners): ${PKG_HTML} → Danger Zone → Change visibility → Public."
            echo "Also enable org Package Creation → Public: https://github.com/organizations/${OWNER}/settings/packages"
            {
              echo "### GHCR visibility"
              echo ""
              echo "Pushed \`${IMAGE_REMOTE}\` and \`${IMAGE_REMOTE_LATEST}\`."
              echo "Package visibility is **${VISIBILITY:-unknown}** (not flipped by this job)."
              echo "One-time UI: [package settings](${PKG_HTML}) → Danger Zone → Public."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub Release on master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ needs.integration.outputs.app_repository }}
        run: |
          set -euo pipefail
          META="${GITHUB_WORKSPACE}/${IMAGE_META}"
          if [ -f "${META}" ]; then
            set -a
            # shellcheck disable=SC1090
            . "${META}"
            set +a
          fi
          if [ -z "${IMAGE_TAG:-}" ] || [ -z "${IMAGE_REMOTE:-}" ]; then
            echo "::error::IMAGE_TAG/IMAGE_REMOTE missing. Expected ${IMAGE_META} in rest-api-release-docker-image."
            cat "${META}" || true
            exit 1
          fi
          TAG="v${IMAGE_TAG}"
          NOTES="$(
            printf '%s\n' \
              "Release **${TAG}** from \`master\`." \
              "" \
              "GHCR (public):" \
              "- \`docker pull ${IMAGE_REMOTE}\`" \
              "- \`docker pull ${IMAGE_REMOTE_LATEST}\`" \
              "" \
              "DAST: OWASP ZAP baseline + Dastardly (gate) and Nuclei (report-only)." \
              "Combined DAST PDF: \`combined-dast-report.pdf\` (artifact \`dast-combined-report-pdf\`)."
          )"
          mapfile -t ATTACH < <(find "${GITHUB_WORKSPACE}/release-package" "${GITHUB_WORKSPACE}/release-dast" -type f 2>/dev/null | sort)
          gh release create "${TAG}" \
            --repo "${GH_REPO}" \
            --target master \
            --title "${TAG}" \
            --notes "${NOTES}" \
            "${ATTACH[@]}"
          echo "Created GitHub Release ${TAG} on ${GH_REPO} (target master)."
