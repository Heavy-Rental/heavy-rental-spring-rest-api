# =============================================================================
# Install into: heavy-rental-spring-rest-api
# Path:         .github/workflows/rest-api-ci-caller.yml
# =============================================================================
# GitHub Flow CI caller — validates feature-branch pull requests before merge.
#
# Place both files in the Spring REST API repository:
#
#   .github/workflows/rest-api-ci-caller.yml      ← this file (triggers)
#   .github/workflows/integration-pipeline.yml    ← reusable pipeline (called)
#
# Reusable workflow (same repository):
#   ./.github/workflows/integration-pipeline.yml
#
# GitHub Environment + secrets
# ----------------------------
# This job uses environment: integration so environment-scoped secrets are
# available and forwarded with secrets: inherit.
#
# Create Environment "integration" (Settings → Environments) and add secrets:
#   REST_API_DB_NAME
#   REST_API_DB_USER
#   REST_API_DB_PASSWORD
#   REST_API_DB_PORT
#   REST_API_DB_URL
#
# Job priority
# ------------
#   1. Integration           ← HIGHEST PRIORITY
#   2. Quality Control       (uses Environment secrets for Postgres tests)
#   2. Security Testing
#   2. CodeQL Analysis
#   3. GitHub Flow CI Gate
# =============================================================================

name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: rest-api-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  integration-pipeline:
    name: Integration pipeline
    # Required: load Environment secrets, then pass them into the reusable workflow
    environment: integration
    uses: ./.github/workflows/integration-pipeline.yml
    with:
      # Must match `environment:` above so QC can attach the same Environment
      github_environment: integration
    secrets: inherit
