# =============================================================================
# Install into: heavy-rental-spring-rest-api
# Path:         .github/workflows/rest-api-ci-caller.yml
# =============================================================================
# GitHub Flow CI caller — validate PRs/pushes to develop only.
# Does NOT deploy. Does NOT run release packaging / GHCR.
#
# Place both files in the Spring REST API repository:
#
#   .github/workflows/rest-api-ci-caller.yml      ← this file (triggers)
#   .github/workflows/integration-pipeline.yml    ← reusable pipeline (called)
#
# Triggers: PR → develop, push → develop, workflow_dispatch.
# Release / deploy packaging: rest-api-release-caller.yml only.
#
# Secrets (in heavy-rental-spring-rest-api)
# ----------------------------------------
# Do NOT set `environment:` on this caller job (invalid with uses:).
# Do NOT use secrets: inherit (Semgrep).
# Do NOT pass REST_API_DB_* here — a uses: job cannot read Environment
# secrets, so an explicit map is empty and would shadow QC.
#
# QC inside the reusable workflow uses environment: integration and loads:
#   REST_API_DB_NAME
#   REST_API_DB_USER
#   REST_API_DB_PASSWORD
#   REST_API_DB_PORT
# from Settings → Environments → integration → Environment secrets.
#
# REST_API_DB_URL is optional — after Docker Postgres starts, QC builds:
#   jdbc:postgresql://localhost:<PORT>/<NAME>
# =============================================================================

name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: rest-api-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read
  checks: write

jobs:
  # Reusable-workflow call: only uses / with (no environment, no secrets, no runs-on)
  integration-pipeline:
    name: Integration pipeline
    uses: ./.github/workflows/integration-pipeline.yml
    with:
      github_environment: integration
    # No secrets: map and no secrets: inherit. QC (environment: integration)
    # reads REST_API_DB_* from Environment secrets in this repository.
