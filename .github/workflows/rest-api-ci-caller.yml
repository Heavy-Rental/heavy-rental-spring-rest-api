# =============================================================================
# Install into: heavy-rental-spring-rest-api
# Path:         .github/workflows/rest-api-ci-caller.yml
# =============================================================================
# GitHub Flow CI caller — validate PRs/pushes to develop only.
# Does NOT deploy. Does NOT run release packaging / GHCR.
#
# Place both files in the Spring REST API repository:
#
#   .github/workflows/rest-api-ci-caller.yml      ← this file (triggers)
#   .github/workflows/integration-pipeline.yml    ← reusable pipeline (called)
#
# Triggers: PR → develop, push → develop, workflow_dispatch.
# Release / deploy packaging: rest-api-release-caller.yml only.
#
# Secrets (in heavy-rental-spring-rest-api)
# ----------------------------------------
# Do NOT set `environment:` on this caller job (invalid with uses:).
# QC inside the reusable workflow uses environment: integration
# (for test DB secrets only — not a production deploy target).
#
# Add secrets (Environment "integration" and/or Repository secrets):
#   REST_API_DB_NAME
#   REST_API_DB_USER
#   REST_API_DB_PASSWORD
#   REST_API_DB_PORT
#
# REST_API_DB_URL is optional — after Docker Postgres starts, QC builds:
#   jdbc:postgresql://localhost:<PORT>/<NAME>
#
# explicit secrets: map forwards repository secrets into the reusable workflow;
# Environment secrets are available on the QC job via environment: integration.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: rest-api-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read
  checks: write

jobs:
  # Reusable-workflow call: only uses / with / secrets (no environment, no runs-on)
  integration-pipeline:
    name: Integration pipeline
    uses: ./.github/workflows/integration-pipeline.yml
    with:
      github_environment: integration
    # Explicit secrets only (Semgrep: avoid secrets: inherit)
    secrets:
      REST_API_DB_NAME: ${{ secrets.REST_API_DB_NAME }}
      REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
      REST_API_DB_PASSWORD: ${{ secrets.REST_API_DB_PASSWORD }}
      REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
