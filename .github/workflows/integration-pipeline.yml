# =============================================================================
# Heavy Rental Spring REST API — Integration CI Pipeline (reusable)
# =============================================================================
# Stages (priority order — Integration Check is highest priority):
#   1. Integration Check (HIGHEST) checkout, Java 21 + Maven, resolve deps, layout
#      On pull_request: reuse a successful Fast Feedback CI run for the PR head
#      SHA instead of repeating those steps. Fast Feedback owns the Integration
#      stage on feature-branch pushes; this job must not invoke that workflow.
#      Push to develop / workflow_dispatch / missing Fast Feedback → run fully.
#   2. Quality Control  needs Integration Check — compile, tests (Postgres), package WAR
#   3. Security Testing needs Integration Check — SAST (Semgrep) + SCA/FS (Trivy)
#   4. CodeQL Analysis  needs Integration Check — GitHub CodeQL (Java) security + quality
#   5. GitHub Flow CI Gate — aggregate: Integration Check first, then QC + Security + CodeQL
#
# Security report format (standard): SARIF 2.1.0
#   - Semgrep → semgrep.sarif
#   - Trivy FS → trivy-fs.sarif
#   - CodeQL → GitHub Code Scanning (native SARIF via analyze)
# Human-readable combined report: security-reports/combined-security-report.pdf
#   Artifact: security-combined-report-pdf
#   PR Checks tab: open this workflow → Summary → Artifacts, or Security Testing job summary.
# Human-readable console output is for gates/logs only, not the report standard.
#
# GitHub Flow for develop (validate only — NEVER deploys)
# --------------------------------------------------------------------------
# This pipeline is CI only: merge-into-develop validation. It does not
# publish images, push to GHCR, write cloud JDBC deploy config, or deploy.
#
#   1. Branch from develop
#   2. Push feature branch → rest-api-fast-feedback-caller (Integration stage once)
#   3. Open PR → develop (or push to develop) → rest-api-ci-caller → this workflow
#      PR Integration Check reuses Fast Feedback for the head SHA; do not call
#      fast-feedback-pipeline.yml from rest-api-ci-caller.yml (that would run it twice).
#   4. Branch protection on develop should require:
#        - "Integration Check"        ← highest priority / must pass first
#        - "Quality Control"
#        - "Security Testing"
#        - "CodeQL Analysis"
#        - "GitHub Flow CI Gate"       ← optional single aggregate check
#   5. Merge when green → develop is integration-tested, not production-deployed
#   6. Deploy packaging / GHCR lives only in release-pipeline.yml
#      (workflow_dispatch via rest-api-release-caller.yml; creates the GitHub Release)
#
# QC "Package WAR" + artifact upload = build verification only (not a deploy).
# environment: integration on QC = secrets isolation for local Docker Postgres tests.
#
# How the REST API uses this
# --------------------------
# Install both files into the Spring REST API repository:
#
#   .github/workflows/integration-pipeline.yml   ← this file (reusable only)
#   .github/workflows/rest-api-ci-caller.yml      ← sole allowed entry point
#
# This file exposes only workflow_call (no push / PR / workflow_dispatch).
# A gate job rejects any caller other than rest-api-ci-caller.yml.
#
# The caller invokes this workflow with:
#   uses: ./.github/workflows/integration-pipeline.yml
#
# Authoring copy lives in this tree. Install into the Spring repo as
#   .github/workflows/integration-pipeline.yml
# There is no .github/workflows/rest-api-ci.yml mirror in this repo.
#
# Local validation (pipeline-development repo root, in the devcontainer):
#   actionlint heavy-rental-rest-api/integration-pipeline/integration-pipeline.yml
#
# Required GitHub Actions secrets (no credentials in this YAML)
# -------------------------------------------------------------
# Secrets (configure in the APPLICATION repo: heavy-rental-spring-rest-api)
# -----------------------------------------------------------------------
# Quality Control uses environment: integration (hardcoded). The caller
# forwards REST_API_DB_* via an explicit secrets map (not secrets: inherit).
# A uses: job cannot read Environment secrets, so configure them as
# Repository secrets in the APPLICATION repo (and optionally also on
# Environment "integration" for isolation / protection rules):
#   Settings → Secrets and variables → Actions → Repository secrets
#
# Names (exact match, case-sensitive):
#   REST_API_DB_NAME
#   REST_API_DB_USER
#   REST_API_DB_PASSWORD
#   REST_API_DB_PORT
#
# REST_API_DB_URL is NOT required. After "Start PostgreSQL", QC builds:
#   jdbc:postgresql://localhost:<PORT>/<NAME>
# and exports it as REST_API_DB_URL for Spring tests (GITHUB_ENV).
#
# Do not set environment: on the caller job that uses: this workflow.
# Never commit real values.
# =============================================================================

name: REST API CI

# Reusable only — no push, pull_request, or workflow_dispatch.
# Sole allowed caller: .github/workflows/rest-api-ci-caller.yml (enforced below).
on:
  workflow_call:
    inputs:
      app_repository:
        description: >
          Override application repository (owner/name). Leave empty to use the
          calling repository (required for PR checks on the REST API).
        required: false
        type: string
        default: ""
      app_ref:
        description: >
          Override git ref (branch/tag/SHA). Leave empty to use the calling
          workflow's commit (github.sha) — correct for pull_request events.
        required: false
        type: string
        default: ""
      github_environment:
        description: >
          Unused. Quality Control hardcodes environment: integration. Callers still
          pass integration so the contract stays visible.
        required: false
        type: string
        default: integration
    secrets:
      REST_API_DB_NAME:
        description: PostgreSQL database name
        required: false
      REST_API_DB_USER:
        description: PostgreSQL username
        required: false
      REST_API_DB_PASSWORD:
        description: PostgreSQL password
        required: false
      REST_API_DB_PORT:
        description: Host port for CI Postgres container
        required: false
      # REST_API_DB_URL is derived after Docker Postgres starts (not a secret)

# GitHub Flow: one concurrent run per PR (or branch); newer pushes cancel stale runs
concurrency:
  group: rest-api-ci-${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # pull_request events need read to resolve PR head metadata when called from the API repo
  pull-requests: read
  # Required for github/codeql-action/upload-sarif (Security stage → Code Scanning)
  security-events: write
  actions: read
  # Publish a Checks-tab download link for the combined security PDF
  checks: write

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin
  APP_PATH: app
  DEFAULT_APP_REPOSITORY: SA62-team1/heavy-rental-spring-rest-api
  # Integration CI is develop-only (rest-api-ci-caller.yml push/PR → develop)
  DEFAULT_APP_REF: develop
  # Non-sensitive Spring/JPA settings only — credentials come from GitHub Secrets
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.wagon.http.retryHandler.count=3"

jobs:
  # ---------------------------------------------------------------------------
  # 0. Caller gate — only rest-api-ci-caller.yml may invoke this workflow
  # ---------------------------------------------------------------------------
  assert-caller:
    name: Assert caller
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow only rest-api-ci-caller.yml
        env:
          # github context is that of the caller workflow for reusable workflows
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          echo "github.workflow_ref=${WORKFLOW_REF}"
          echo "github.event_name=${EVENT_NAME}"
          echo "github.workflow=${WORKFLOW_NAME}"
          case "${WORKFLOW_REF}" in
            */.github/workflows/rest-api-ci-caller.yml@*)
              echo "Allowed caller: rest-api-ci-caller.yml"
              {
                echo "### Caller gate"
                echo ""
                echo "Invoked by \`rest-api-ci-caller.yml\` — OK."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::integration-pipeline.yml may only be invoked by .github/workflows/rest-api-ci-caller.yml (got: ${WORKFLOW_REF})"
              exit 1
              ;;
          esac

  # ---------------------------------------------------------------------------
  # 1. Integration Check — HIGHEST PRIORITY (GitHub Flow PR gate starts here)
  #    All other jobs declare needs: integration-check so they never run if this fails.
  #    Job id is integration-check so it is not confused with environment: integration.
  #    Always run this job (never if: skip it) so QC / Security / CodeQL keep
  #    their needs: and branch protection still sees the check.
  #    On pull_request, skip Maven/layout when Fast Feedback already passed for
  #    the PR head SHA. Do not uses: fast-feedback-pipeline.yml from the CI caller.
  # ---------------------------------------------------------------------------
  integration-check:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [assert-caller]
    timeout-minutes: 20
    # Fail-fast entry point for the entire workflow
    outputs:
      app_repository: ${{ steps.meta.outputs.app_repository }}
      app_ref: ${{ steps.meta.outputs.app_ref }}
      checkout_mode: ${{ steps.meta.outputs.checkout_mode }}
    steps:
      - name: Resolve application source (same-repo caller vs remote override)
        id: meta
        env:
          # Bind contexts here — never interpolate github/inputs directly in run: scripts
          # (avoids Semgrep run-shell-injection).
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.app_repository }}
          INPUT_REF: ${{ inputs.app_ref }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          DEFAULT_APP_REF_VALUE: ${{ env.DEFAULT_APP_REF }}
        run: |
          set -euo pipefail
          EVENT="${EVENT_NAME}"
          INPUT_REPO="${INPUT_REPO}"
          INPUT_REF="${INPUT_REF}"

          if [ -n "${INPUT_REPO}" ] && [ "${INPUT_REPO}" != "${GH_REPOSITORY}" ]; then
            APP_REPO="${INPUT_REPO}"
            APP_REF="${INPUT_REF:-${DEFAULT_APP_REF_VALUE}}"
            MODE=remote
          else
            # Same-repo caller: use this commit
            APP_REPO="${GH_REPOSITORY}"
            APP_REF="${INPUT_REF:-${GH_SHA}}"
            MODE=caller
          fi

          echo "app_repository=$APP_REPO" >> "$GITHUB_OUTPUT"
          echo "app_ref=$APP_REF" >> "$GITHUB_OUTPUT"
          echo "checkout_mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "### Source resolution"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$EVENT\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Repository | \`$APP_REPO\` |"
            echo "| Ref | \`$APP_REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integrating application: $APP_REPO @ $APP_REF (mode=$MODE)"

      - name: Reuse Fast Feedback Integration when it already passed
        id: reuse
        env:
          # Bind contexts here — never interpolate github/inputs directly in run: scripts
          # (avoids Semgrep run-shell-injection).
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPOSITORY: ${{ github.repository }}
          FF_WORKFLOW_FILE: rest-api-fast-feedback-caller.yml
        run: |
          set -euo pipefail
          REUSE=false

          finish() {
            echo "reuse=${REUSE}" >> "$GITHUB_OUTPUT"
            {
              echo "### Fast Feedback reuse"
              echo ""
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "Event is ${EVENT_NAME} (not pull_request) — run Integration Check."
            finish "Event \`${EVENT_NAME}\` — ran Integration Check locally (Fast Feedback is feature-branch push only)."
            exit 0
          fi

          COMMIT="${HEAD_SHA}"
          if [ -z "${COMMIT}" ]; then
            echo "PR head SHA is empty — run Integration Check."
            finish "PR head SHA empty — ran Integration Check locally."
            exit 0
          fi

          echo "Looking up Fast Feedback (${FF_WORKFLOW_FILE}) for commit ${COMMIT}"

          list_runs() {
            gh run list \
              --repo "${GH_REPOSITORY}" \
              --workflow "${FF_WORKFLOW_FILE}" \
              --commit "${COMMIT}" \
              --json databaseId,status,conclusion,url \
              --limit 20 \
              2>/dev/null || echo "[]"
          }

          run_count() {
            echo "${1}" | jq 'length' 2>/dev/null || echo 0
          }

          jq_field() {
            echo "${1}" | jq -r "${2}" 2>/dev/null || true
          }

          # PR opened in the same moment as the push: the Fast Feedback run may
          # not exist yet. Retry briefly before falling back to local checks.
          ATTEMPT=1
          MAX_APPEAR=12
          RUNS="[]"
          while [ "${ATTEMPT}" -le "${MAX_APPEAR}" ]; do
            RUNS="$(list_runs)"
            [ -n "${RUNS}" ] || RUNS="[]"
            if [ "$(run_count "${RUNS}")" -gt 0 ]; then
              break
            fi
            echo "No Fast Feedback run for ${COMMIT} yet (attempt ${ATTEMPT}/${MAX_APPEAR})"
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done

          [ -n "${RUNS}" ] || RUNS="[]"
          if [ "$(run_count "${RUNS}")" -eq 0 ]; then
            echo "No Fast Feedback run for ${COMMIT} — run Integration Check."
            finish "No Fast Feedback run for \`${COMMIT}\` — ran Integration Check locally."
            exit 0
          fi

          jq_field "${RUNS}" '.[] | "id=\(.databaseId) status=\(.status) conclusion=\(.conclusion // "null") url=\(.url)"'

          SUCCESS_ID="$(jq_field "${RUNS}" '[.[] | select(.conclusion == "success")] | .[0].databaseId // empty')"
          SUCCESS_URL="$(jq_field "${RUNS}" '[.[] | select(.conclusion == "success")] | .[0].url // empty')"
          if [ -n "${SUCCESS_ID}" ]; then
            REUSE=true
            echo "Reusing successful Fast Feedback run ${SUCCESS_ID}: ${SUCCESS_URL}"
            finish "Reused Fast Feedback run [${SUCCESS_ID}](${SUCCESS_URL}) for \`${COMMIT}\`. Maven/layout steps skipped."
            exit 0
          fi

          PENDING_FILTER='[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")]'
          PENDING_ID="$(jq_field "${RUNS}" "${PENDING_FILTER} | .[0].databaseId // empty")"
          PENDING_URL="$(jq_field "${RUNS}" "${PENDING_FILTER} | .[0].url // empty")"
          if [ -z "${PENDING_ID}" ]; then
            echo "Fast Feedback finished without success for ${COMMIT} — run Integration Check."
            finish "Fast Feedback did not succeed for \`${COMMIT}\` — ran Integration Check locally."
            exit 0
          fi

          echo "Waiting for in-flight Fast Feedback run ${PENDING_ID}: ${PENDING_URL}"
          set +e
          timeout 600 gh run watch "${PENDING_ID}" --repo "${GH_REPOSITORY}" --exit-status --interval 10
          WATCH_RC=$?
          set -e
          if [ "${WATCH_RC}" -eq 0 ]; then
            REUSE=true
            echo "Fast Feedback run ${PENDING_ID} succeeded — skip Maven/layout."
            finish "Waited for Fast Feedback run [${PENDING_ID}](${PENDING_URL}) (success). Maven/layout steps skipped."
            exit 0
          fi

          echo "Fast Feedback run ${PENDING_ID} did not succeed (watch exit=${WATCH_RC}) — run Integration Check."
          finish "Fast Feedback run [${PENDING_ID}](${PENDING_URL}) did not succeed (watch exit=${WATCH_RC}) — ran Integration Check locally."

      - name: Checkout calling repository (PR / push head)
        if: steps.meta.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: steps.meta.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.meta.outputs.app_repository }}
          ref: ${{ steps.meta.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_PATH }}/pom.xml

      - name: Ensure Maven Wrapper is executable
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            echo "Using Maven Wrapper (./mvnw)"
          else
            echo "::error::mvnw not found — this pipeline expects the Maven Wrapper in the REST API repo."
            exit 1
          fi

      - name: Resolve Maven dependencies
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./mvnw -B -ntp dependency:resolve dependency:resolve-plugins

      - name: Verify project layout and toolchain
        if: steps.reuse.outputs.reuse != 'true'
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          echo "==> Java / Maven versions"
          java -version
          ./mvnw -v
          echo "==> Required files"
          test -f pom.xml
          test -f mvnw
          test -d src/main/java
          test -d src/main/resources
          echo "==> Packaging from pom.xml"
          PACKAGING="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.packaging)"
          ARTIFACT="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.artifactId)"
          VERSION="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          JAVA_PROP="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=java.version || true)"
          echo "artifactId=$ARTIFACT version=$VERSION packaging=$PACKAGING java.version=$JAVA_PROP"
          {
            echo "### Integration checks"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Artifact | \`$ARTIFACT\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Packaging | \`$PACKAGING\` |"
            echo "| Java (pom) | \`$JAVA_PROP\` |"
            echo "| Runner Java | \`${{ env.JAVA_VERSION }}\` (${{ env.JAVA_DISTRIBUTION }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Integration checks passed."

      - name: Upload Maven project fingerprint
        uses: actions/upload-artifact@v7
        with:
          name: integration-metadata
          path: |
            ${{ env.APP_PATH }}/pom.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Quality control — runs only after Integration Check succeeds (priority 2)
  # ---------------------------------------------------------------------------
  quality-control:
    name: Quality Control
    runs-on: ubuntu-latest
    needs: [integration-check]
    # Hardcoded Environment name (more reliable than dynamic expressions for secrets).
    # Loads Environment secrets + any secrets passed via explicit secrets map.
    environment: 
      name: integration
      deployment: false
    timeout-minutes: 30
    steps:
      - name: Verify required database secrets are configured
        env:
          REST_API_DB_NAME: ${{ secrets.REST_API_DB_NAME }}
          REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
          REST_API_DB_PASSWORD: ${{ secrets.REST_API_DB_PASSWORD }}
          REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
        run: |
          set -euo pipefail
          echo "Quality Control secrets source: caller explicit secrets map and/or GitHub Environment 'integration'."
          missing=()
          [ -n "${REST_API_DB_NAME}" ] || missing+=(REST_API_DB_NAME)
          [ -n "${REST_API_DB_USER}" ] || missing+=(REST_API_DB_USER)
          [ -n "${REST_API_DB_PASSWORD}" ] || missing+=(REST_API_DB_PASSWORD)
          [ -n "${REST_API_DB_PORT}" ] || missing+=(REST_API_DB_PORT)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo ""
            echo "Configure in the APPLICATION repository (where this workflow runs), not pipeline-development:"
            echo "  1) Settings → Secrets and variables → Actions → Repository secrets"
            echo "     (required for the caller explicit secrets map)"
            echo "  2) Settings → Environments → integration → Environment secrets"
            echo "     (optional; this job also uses environment: integration)"
            echo ""
            echo "Required names (exact, case-sensitive):"
            echo "  REST_API_DB_NAME, REST_API_DB_USER, REST_API_DB_PASSWORD, REST_API_DB_PORT"
            echo "  (REST_API_DB_URL is optional — built after Docker Postgres starts)"
            echo ""
            echo "Caller must include: explicit secrets map"
            echo "This job uses: environment: integration"
            exit 1
          fi
          if ! [[ "${REST_API_DB_PORT}" =~ ^[0-9]+$ ]]; then
            echo "::error::REST_API_DB_PORT must be a numeric TCP port."
            exit 1
          fi
          echo "All required database secrets are present (values not logged)."

      - name: Checkout calling repository (PR / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.integration-check.outputs.app_repository }}
          ref: ${{ needs.integration-check.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_PATH }}/pom.xml

      - name: Ensure Maven Wrapper is executable
        working-directory: ${{ env.APP_PATH }}
        run: chmod +x ./mvnw

      - name: Start PostgreSQL (Docker; credentials and port from secrets)
        env:
          REST_API_DB_NAME: ${{ secrets.REST_API_DB_NAME }}
          REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
          REST_API_DB_PASSWORD: ${{ secrets.REST_API_DB_PASSWORD }}
          REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
        run: |
          set -euo pipefail
          docker rm -f rest-api-ci-postgres >/dev/null 2>&1 || true
          # Host port from secret → container listens on Postgres image default 5432
          docker run -d --name rest-api-ci-postgres \
            -e POSTGRES_DB="${REST_API_DB_NAME}" \
            -e POSTGRES_USER="${REST_API_DB_USER}" \
            -e POSTGRES_PASSWORD="${REST_API_DB_PASSWORD}" \
            -p "${REST_API_DB_PORT}:5432" \
            postgres:16-alpine
          # Build JDBC URL for later steps (Spring tests). No password in the URL.
          # Available as env.REST_API_DB_URL after this step via GITHUB_ENV.
          JDBC_URL="jdbc:postgresql://localhost:${REST_API_DB_PORT}/${REST_API_DB_NAME}"
          {
            echo "REST_API_DB_URL=${JDBC_URL}"
            echo "REST_API_DB_NAME=${REST_API_DB_NAME}"
            echo "REST_API_DB_USER=${REST_API_DB_USER}"
            echo "REST_API_DB_PORT=${REST_API_DB_PORT}"
          } >> "$GITHUB_ENV"
          echo "PostgreSQL container started."
          echo "Derived REST_API_DB_URL=jdbc:postgresql://localhost:${REST_API_DB_PORT}/<db> (password not in URL)."

      - name: Wait for PostgreSQL
        env:
          REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
          REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
        run: |
          set -euo pipefail
          PORT="${REST_API_DB_PORT}"
          for i in $(seq 1 30); do
            if docker exec rest-api-ci-postgres pg_isready -U "${REST_API_DB_USER}" >/dev/null 2>&1; then
              echo "PostgreSQL is accepting connections on localhost:${PORT}"
              exit 0
            fi
            if timeout 1 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/${PORT}" 2>/dev/null; then
              # TCP open; give pg_isready one more chance next loop
              :
            fi
            echo "Waiting for PostgreSQL... ($i)"
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready in time on the configured port"
          docker logs rest-api-ci-postgres 2>&1 | tail -n 50 || true
          exit 1

      - name: Compile (main + test sources)
        working-directory: ${{ env.APP_PATH }}
        run: ./mvnw -B -ntp -DskipTests compile test-compile

      - name: Unit and Spring Boot tests
        working-directory: ${{ env.APP_PATH }}
        env:
          # Spring Boot binds these env vars automatically — do not pass passwords
          # on the Maven CLI (would appear in process listings).
          # REST_API_DB_URL was built after Start PostgreSQL and written to GITHUB_ENV.
          SPRING_DATASOURCE_URL: ${{ env.REST_API_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.REST_API_DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.REST_API_DB_PASSWORD }}
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${{ env.SPRING_DATASOURCE_DRIVER_CLASS_NAME }}
          SPRING_JPA_DATABASE_PLATFORM: ${{ env.SPRING_JPA_DATABASE_PLATFORM }}
        run: |
          set -euo pipefail
          if [ -z "${REST_API_DB_URL:-}" ]; then
            echo "::error::REST_API_DB_URL is empty — Start PostgreSQL must export it via GITHUB_ENV."
            exit 1
          fi
          echo "Running tests with SPRING_DATASOURCE_URL derived from Docker Postgres (password not logged)."
          # Use runner-native $GITHUB_WORKSPACE (never github context interpolation inside run scripts)
          mkdir -p "${GITHUB_WORKSPACE}/test-reports"
          ./mvnw -B -ntp test
          # Collect surefire / failsafe reports when present
          if [ -d target/surefire-reports ]; then
            cp -a target/surefire-reports "${GITHUB_WORKSPACE}/test-reports/" || true
          fi
          if [ -d target/failsafe-reports ]; then
            cp -a target/failsafe-reports "${GITHUB_WORKSPACE}/test-reports/" || true
          fi

      - name: Package WAR (skip re-running tests)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -DskipTests package
          echo "==> Build artifacts"
          ls -lah target/ || true
          WAR_COUNT="$(find target -maxdepth 1 -type f \( -name '*.war' -o -name '*.jar' \) | wc -l | tr -d ' ')"
          if [ "${WAR_COUNT}" -lt 1 ]; then
            echo "::error::No .war/.jar produced under target/ after package"
            exit 1
          fi
          find target -maxdepth 1 -type f \( -name '*.war' -o -name '*.jar' \) -ls
          {
            echo "### Quality control"
            echo ""
            echo "Compile, tests, and package completed successfully."
            echo ""
            echo "Artifacts:"
            echo '```'
            find target -maxdepth 1 -type f \( -name '*.war' -o -name '*.jar' \) -printf '%f (%s bytes)\n' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop PostgreSQL
        if: always()
        run: |
          set -euo pipefail
          docker rm -f rest-api-ci-postgres >/dev/null 2>&1 || true
          echo "PostgreSQL container stopped."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-test-reports
          path: |
            test-reports/
            ${{ env.APP_PATH }}/target/surefire-reports/
            ${{ env.APP_PATH }}/target/failsafe-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: rest-api-package
          path: |
            ${{ env.APP_PATH }}/target/*.war
            ${{ env.APP_PATH }}/target/*.jar
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. Security testing — runs only after Integration Check succeeds (priority 2,
  #    parallel with Quality Control so Integration Check remains the critical path)
  # ---------------------------------------------------------------------------
  security-testing:
    name: Security Testing
    runs-on: ubuntu-latest
    # Highest-priority gate: never start Security unless Integration Check passed
    needs: [integration-check]
    timeout-minutes: 40
    steps:
      - name: Checkout calling repository (PR / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.integration-check.outputs.app_repository }}
          ref: ${{ needs.integration-check.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Create security reports directory
        run: mkdir -p "${GITHUB_WORKSPACE}/security-reports"

      # --- SAST: static analysis (standard report format: SARIF) ---
      - name: Setup Python (Semgrep)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --quiet semgrep

      - name: SAST — Semgrep (Java / OWASP) → SARIF
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/security-reports"
          # p/spring was removed from the Semgrep registry (HTTP 404).
          # Community packs: Java/OWASP/CWE plus secrets, injection, JWT, TLS.
          # Custom rules catch plaintext credentials in Spring properties/YAML
          # that p/secrets and p/gitleaks miss (generic passwords, not tokens).
          RULES_FILE="${REPORT_DIR}/semgrep-custom-rules.yml"
          cat > "${RULES_FILE}" << 'SEMGREP_CUSTOM_RULES'
          rules:
            - id: heavy-rental.rest-api.hardcoded-credential-in-properties
              languages: [regex]
              severity: ERROR
              message: >
                Hard-coded credential in a properties/env file (CWE-798). Use
                ${ENV_VAR} or a secrets manager. A plaintext password, secret,
                token, or API key in application.properties is a shipping secret.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [spring, secrets]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
              paths:
                include:
                  - "*.properties"
                  - "*.env"
                  - "*.ini"
                exclude:
                  - "**/src/test/**"
                  - "**/*example*"
                  - "**/*sample*"
              pattern-regex: >-
                (?i)^[ \t]*[A-Za-z0-9._-]*(?:password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)[ \t]*=[ \t]*(?!\$\{)(?!ENC\()(?!\{cipher\})(?![ \t]*(?:#|$))[^\s#]+
            - id: heavy-rental.rest-api.hardcoded-credential-in-yaml
              languages: [regex]
              severity: ERROR
              message: >
                Hard-coded credential in YAML config (CWE-798). Use ${ENV_VAR}
                or a secrets manager instead of a plaintext password or secret.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [spring, secrets]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
              paths:
                include:
                  - "*.yml"
                  - "*.yaml"
                exclude:
                  - "**/src/test/**"
                  - "**/*example*"
                  - "**/*sample*"
                  - "**/.github/**"
              # persist-credentials is filtered with pattern-not-regex; a key
              # lookahead still matches because credentials? is a suffix.
              patterns:
                - pattern-regex: |-
                    (?i)^[ \t-]*["']?(?:[A-Za-z0-9._-]*[\._-])?(password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)["']?[ \t]*:[ \t]*(?!\$\{)(?!~)(?!null\b)(?!ENC\()(?!\{cipher\})(?!["']?[ \t]*(?:#|$))["']?[^\s#"']+
                - pattern-not-regex: '(?i)persist[-_]credentials\s*:'
            - id: heavy-rental.rest-api.env-placeholder-plaintext-default
              languages: [regex]
              severity: ERROR
              message: >
                Spring ${VAR:default} placeholder embeds a plaintext credential
                default (CWE-798). Empty defaults (${VAR:} or ${VAR}) are OK;
                a literal fallback password is not.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [spring, secrets]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: MEDIUM
                impact: HIGH
              paths:
                include:
                  - "*.properties"
                  - "*.yml"
                  - "*.yaml"
                  - "*.env"
                exclude:
                  - "**/src/test/**"
                  - "**/*example*"
                  - "**/*sample*"
                  - "**/.github/**"
              pattern-regex: >-
                (?i)^[ \t]*[A-Za-z0-9._-]*(?:password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)[ \t]*[=:][ \t]*\$\{[^}:]+:(?![ \t]*\})[^}]+\}
            - id: heavy-rental.rest-api.jdbc-url-embedded-credentials
              languages: [regex]
              severity: ERROR
              message: >
                JDBC URL embeds user:password@host (CWE-798). Use a URL without
                credentials and set username/password from environment variables.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [java, jdbc, secrets]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
              paths:
                include:
                  - "*.properties"
                  - "*.yml"
                  - "*.yaml"
                  - "*.xml"
                  - "*.java"
                  - "*.env"
                exclude:
                  - "**/src/test/**"
                  - "**/.github/**"
              pattern-regex: >-
                (?i)jdbc:[a-z0-9]+://[^/\s:]+:[^@/\s]+@
            - id: heavy-rental.rest-api.java-hardcoded-secret-assignment
              languages: [java]
              severity: ERROR
              message: >
                Hard-coded credential assigned in Java source (CWE-798). Inject
                the value from the environment or a secrets manager.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [java, secrets]
                confidence: MEDIUM
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
              paths:
                exclude:
                  - "**/src/test/**"
                  - "**/*Test.java"
                  - "**/*Tests.java"
              patterns:
                - pattern-either:
                    - pattern: $TYPE $VAR = "$VAL";
                    - pattern: $VAR = "$VAL";
                - metavariable-regex:
                    metavariable: $VAR
                    regex: (?i).*(password|passwd|secret|api[_]?key|token|credential).*
                - metavariable-regex:
                    metavariable: $VAR
                    regex: (?i)^(?!.*(path|url|uri|type|claim|header|prefix|suffix|chars|alphabet|pattern|format)).*$
                - metavariable-regex:
                    metavariable: $VAL
                    regex: (?!\$\{)(?!/).{3,}
            - id: heavy-rental.rest-api.java-setpassword-hardcoded
              languages: [java]
              severity: ERROR
              message: >
                Hard-coded password passed to a setter (CWE-798). Load it from
                the environment or a secrets manager.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [java, secrets]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
              paths:
                exclude:
                  - "**/src/test/**"
                  - "**/*Test.java"
                  - "**/*Tests.java"
              patterns:
                - pattern-either:
                    - pattern: $OBJ.setPassword("$VAL");
                    - pattern: $OBJ.password("$VAL");
                    - pattern: DriverManager.getConnection($URL, $USER, "$VAL");
                - metavariable-regex:
                    metavariable: $VAL
                    regex: (?!\$\{).{1,}
            - id: heavy-rental.rest-api.spring-actuator-fully-exposed
              languages: [regex]
              severity: ERROR
              message: >
                Spring Boot Actuator exposes all endpoints (include=*). Restrict
                to health/info; /actuator/env and /heapdump leak secrets.
              metadata:
                category: security
                cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
                owasp: ["A05:2021 - Security Misconfiguration"]
                technology: [java, spring]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: MEDIUM
                impact: HIGH
              paths:
                include:
                  - "*.properties"
                  - "*.yml"
                  - "*.yaml"
                exclude:
                  - "**/src/test/**"
                  - "**/.github/**"
              pattern-regex: >-
                (?i)management\.endpoints\.web\.exposure\.include\s*[=:]\s*["']?\*
            - id: heavy-rental.rest-api.spring-security-disabled
              languages: [regex]
              severity: ERROR
              message: >
                Spring Security is disabled when spring.security.enabled is false.
                That opens every endpoint. Remove the flag from non-test config.
              metadata:
                category: security
                cwe: ["CWE-284: Improper Access Control"]
                owasp: ["A01:2021 - Broken Access Control"]
                technology: [java, spring]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: MEDIUM
                impact: HIGH
              paths:
                include:
                  - "*.properties"
                  - "*.yml"
                  - "*.yaml"
                exclude:
                  - "**/src/test/**"
                  - "**/.github/**"
              pattern-regex: >-
                (?i)spring\.security\.enabled\s*[=:]\s*["']?false
            # Reusable-workflow / composite-action secret wiring:
            #   secrets: inherit                         → ERROR (over-privilege)
            #   KEY: GitHub secrets context (explicit)   → allowed (least-privilege map)
            #   KEY: literal-password                    → ERROR (CWE-798)
            #   persist-credentials: true|false          → allowed (checkout boolean;
            #     excluded with pattern-not-regex, not a key lookahead)
            # p/secrets and p/gitleaks are not applied to .github (they treat
            # a secrets-context password mapping as a leaked credential).
            - id: heavy-rental.gha.secrets-inherit-forbidden
              languages: [yaml]
              severity: ERROR
              message: >
                secrets: inherit passes every secret the caller can read to the
                reusable workflow (CWE-200). That is over-privilege, not required
                wiring. Pass only the secrets the callee declares via an explicit
                secrets: map (REST_API_DB_PASSWORD from the secrets context).
                An explicit secrets-context map is least privilege and is not a
                leaked credential.
              metadata:
                category: security
                cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
                owasp: ["A05:2021 - Security Misconfiguration"]
                technology: [github-actions, secrets]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
              paths:
                include:
                  - "**/.github/workflows/**"
                  - "**/.github/actions/**"
                exclude:
                  - "**/rest-api-cd-paid-caller.yml"
              patterns:
                - pattern: |
                    secrets: inherit
            - id: heavy-rental.gha.hardcoded-workflow-secret
              languages: [regex]
              severity: ERROR
              message: >
                Hard-coded credential in a GitHub Actions workflow or composite
                action (CWE-798). Use an explicit secrets: map with the GitHub
                secrets context when calling a reusable workflow. Passing
                secrets-context (or inputs-context into a composite action) is
                required wiring, not a vulnerability. A literal password in YAML is.
              metadata:
                category: security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp: ["A07:2021 - Identification and Authentication Failures"]
                technology: [github-actions, secrets]
                confidence: HIGH
                subcategory: [vuln]
                likelihood: HIGH
                impact: HIGH
              paths:
                include:
                  - "**/.github/workflows/**"
                  - "**/.github/actions/**"
              patterns:
                - pattern-regex: |-
                    (?i)^[ \t-]*["']?(?:[A-Za-z0-9._-]*[\._-])?(password|passwd|pwd|secret|secret[-_]?key|api[-._]?key|access[-._]?key|private[-._]?key|auth[-._]?token|credentials?)["']?[ \t]*:[ \t]*(?!\$\{\{)(?!~)(?!null\b)(?!inherit\b)(?!["']?[ \t]*(?:#|$))["']?[^\s#"']+
                - pattern-not-regex: '(?i)persist[-_]credentials\s*:'
          SEMGREP_CUSTOM_RULES
          # run: | already strips this step's indent from the heredoc. A second
          # de-indent (sed) would pull nested list items to column 1 and break YAML.
          echo "==> Validating custom Semgrep rules"
          semgrep --validate --config="${RULES_FILE}" --metrics=off
          # App SAST: Java/OWASP/secrets packs. Skip .github so p/secrets and
          # p/gitleaks do not flag reusable-workflow secrets: maps.
          SEMGREP_APP=(
            --config=p/java
            --config=p/owasp-top-ten
            --config=p/security-audit
            --config=p/secrets
            --config=p/cwe-top-25
            --config=p/findsecbugs
            --config=p/gitleaks
            --config=p/sql-injection
            --config=p/jwt
            --config=p/insecure-transport
            --config="${RULES_FILE}"
            --exclude='.github/**'
            --metrics=off
          )
          # Workflow SAST: GitHub Actions pack + custom GHA rules.
          # Explicit secrets-context maps are not findings. secrets: inherit is.
          # Drop the community inherit rule so the custom one (with paid-CD
          # path exclude) is the only inherit check.
          SEMGREP_GHA=(
            --config=p/github-actions
            --config="${RULES_FILE}"
            --exclude-rule=yaml.github-actions.security.secrets-inherit.secrets-inherit
            --include='.github/**'
            --metrics=off
          )

          # --- Pass 1: always write SARIF (standard report). Does not fail the step. ---
          echo "==> Semgrep report (SARIF 2.1.0) — application"
          set +e
          semgrep scan "${SEMGREP_APP[@]}" \
            --sarif \
            --output="${REPORT_DIR}/semgrep.sarif" \
            .
          SARIF_RC=$?
          echo "==> Semgrep report (SARIF 2.1.0) — GitHub Actions"
          semgrep scan "${SEMGREP_GHA[@]}" \
            --sarif \
            --output="${REPORT_DIR}/semgrep-gha.sarif" \
            .
          GHA_SARIF_RC=$?
          set -e
          if [ -f "${REPORT_DIR}/semgrep.sarif" ]; then
            echo "SARIF written: ${REPORT_DIR}/semgrep.sarif (semgrep exit=${SARIF_RC}; non-zero is OK for report pass)"
          else
            echo "::warning::semgrep.sarif was not produced (exit=${SARIF_RC})"
          fi
          if [ -f "${REPORT_DIR}/semgrep-gha.sarif" ]; then
            echo "SARIF written: ${REPORT_DIR}/semgrep-gha.sarif (semgrep exit=${GHA_SARIF_RC}; non-zero is OK for report pass)"
          else
            echo "::warning::semgrep-gha.sarif was not produced (exit=${GHA_SARIF_RC})"
          fi

          # --- Pass 2: CI gate — fail only if ERROR-severity findings exist. ---
          # --error makes Semgrep exit 1 when any matching finding is present.
          # A "successful" SARIF write can still leave this gate red if ERROR issues exist.
          echo "==> SAST gate — application (ERROR severity only)"
          set +e
          semgrep scan "${SEMGREP_APP[@]}" \
            --severity=ERROR \
            --error \
            --text \
            .
          APP_GATE_RC=$?
          echo "==> SAST gate — GitHub Actions (ERROR severity only)"
          semgrep scan "${SEMGREP_GHA[@]}" \
            --severity=ERROR \
            --error \
            --text \
            .
          GHA_GATE_RC=$?
          set -e
          if [ "${APP_GATE_RC}" -ne 0 ] || [ "${GHA_GATE_RC}" -ne 0 ]; then
            echo "::error::Semgrep SAST gate failed (app exit=${APP_GATE_RC}, gha exit=${GHA_GATE_RC})."
            echo "The SARIF report may still have been written successfully."
            echo "This step fails because --severity=ERROR --error found ERROR-level issues"
            echo "(or Semgrep could not complete the gate scan)."
            echo "Application: security-reports/semgrep.sarif"
            echo "GitHub Actions: security-reports/semgrep-gha.sarif"
            echo "Explicit reusable-workflow secrets-context maps are allowed."
            echo "secrets: inherit is an ERROR (least privilege) except rest-api-cd-paid-caller.yml."
            if [ "${APP_GATE_RC}" -ne 0 ]; then
              exit "${APP_GATE_RC}"
            fi
            exit "${GHA_GATE_RC}"
          fi
          echo "SAST (Semgrep) gate passed — no ERROR-level findings. SARIF: security-reports/semgrep.sarif + semgrep-gha.sarif"

      # --- SCA + filesystem: dependency and secret/vuln scan via Trivy (SARIF) ---
      - name: Setup Java ${{ env.JAVA_VERSION }} (for dependency resolution before scan)
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_PATH }}/pom.xml

      - name: Resolve dependencies for SCA coverage
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          # Materialize the local .m2 / target dependency graph Trivy can inspect
          ./mvnw -B -ntp -DskipTests dependency:resolve dependency:copy-dependencies \
            -DoutputDirectory=target/dependency || \
          ./mvnw -B -ntp -DskipTests dependency:resolve

      # One shared Actions cache for vuln DB + Java DB (avoids ~100MB re-download per step).
      # Weekly key; restore-keys fall back to any prior OS cache. Per-step trivy cache is off.
      - name: Trivy cache key
        id: trivy-cache-meta
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DBs
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-cache-meta.outputs.week }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Pass 1: always write SARIF (standard report). Do not fail the step on findings —
      # otherwise SARIF mode hides the vulns in the log and only shows exit code 1.
      - name: Trivy filesystem scan (SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_PATH }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: security-reports/trivy-fs.sarif
          ignore-unfixed: true
          scanners: vuln
          # Shared job-level cache above; disable nested restore/save per scan
          cache: "false"
          cache-dir: ${{ github.workspace }}/.cache/trivy

      # Pass 2: human-readable findings in the job log (never blocks).
      - name: Trivy filesystem scan (console table)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_PATH }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          ignore-unfixed: true
          scanners: vuln
          cache: "false"
          cache-dir: ${{ github.workspace }}/.cache/trivy

      # Pass 3: CI gate — fail only on CRITICAL, unfixed vulns (mirrors Semgrep ERROR gate).
      - name: Trivy SCA gate (CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_PATH }}
          severity: CRITICAL
          exit-code: "1"
          format: table
          ignore-unfixed: true
          scanners: vuln
          cache: "false"
          cache-dir: ${{ github.workspace }}/.cache/trivy

      # --- Publish SARIF security reports to GitHub Code Scanning ---
      - name: Upload Semgrep SARIF to Code Scanning
        if: always() && hashFiles('security-reports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/semgrep.sarif
          checkout_path: ${{ env.APP_PATH }}
          category: rest-api-semgrep
        continue-on-error: true

      - name: Upload Semgrep GitHub Actions SARIF to Code Scanning
        if: always() && hashFiles('security-reports/semgrep-gha.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/semgrep-gha.sarif
          checkout_path: ${{ env.APP_PATH }}
          category: rest-api-semgrep-gha
        continue-on-error: true

      - name: Upload Trivy SARIF to Code Scanning
        if: always() && hashFiles('security-reports/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/trivy-fs.sarif
          checkout_path: ${{ env.APP_PATH }}
          category: rest-api-trivy-fs
        continue-on-error: true

      # Combined human-readable PDF. Keep in sync with
      # heavy-rental-project-pipeline-development/scripts/combine-security-report.py
      # Download on a pull request: Checks → this workflow → Summary → Artifacts
      # (`security-combined-report-pdf`), or the Security Testing job summary link.
      - name: Install reportlab (combined security PDF)
        if: always()
        run: pip install --quiet reportlab

      - name: Combine security reports into PDF
        if: always()
        env:
          COMBINED_PDF_TITLE: Heavy Rental REST API — Combined security report
        run: |
          set -euo pipefail
          REPORT_DIR="${GITHUB_WORKSPACE}/security-reports"
          mkdir -p "${REPORT_DIR}"
          cat > "${REPORT_DIR}/combine-security-report.py" << 'COMBINE_SECURITY_REPORT_PY'
          #!/usr/bin/env python3
          """Combine SARIF 2.1.0 files (and optional pip-audit JSON) into one PDF.

          Keep this file in sync with the heredoc in each Integration CI
          ``integration-pipeline.yml`` Security Testing job.

          Code snippets from SARIF regions are never copied into the PDF (secret-scanner
          hits can echo credentials).
          """

          from __future__ import annotations

          import argparse
          import json
          import sys
          from collections import Counter
          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from pathlib import Path
          from xml.sax.saxutils import escape as xml_escape

          from reportlab.lib import colors
          from reportlab.lib.pagesizes import letter
          from reportlab.lib.styles import ParagraphStyle, getSampleStyleSheet
          from reportlab.lib.units import inch
          from reportlab.platypus import (
              PageBreak,
              Paragraph,
              SimpleDocTemplate,
              Spacer,
              Table,
              TableStyle,
          )

          MAX_MESSAGE = 400
          MAX_FINDINGS_PER_TOOL = 200
          SKIP_NAMES = {
              "combined-security-report.pdf",
              "combine-security-report.py",
          }


          @dataclass
          class Finding:
              rule_id: str
              level: str
              location: str
              message: str


          @dataclass
          class ToolReport:
              name: str
              source_file: str
              present: bool
              findings: list[Finding] = field(default_factory=list)
              note: str = ""


          def pdf_safe(text: str) -> str:
              raw = "" if text is None else str(text)
              raw = raw.replace("\r\n", "\n").replace("\r", "\n")
              raw = raw.encode("latin-1", "replace").decode("latin-1")
              return xml_escape(raw)


          def truncate(text: str, limit: int = MAX_MESSAGE) -> str:
              text = " ".join((text or "").split())
              if len(text) <= limit:
                  return text
              return text[: limit - 1] + "…"


          def result_level(result: dict, rules_by_id: dict) -> str:
              level = (result.get("level") or "").strip().lower()
              if level:
                  return level
              rule_id = result.get("ruleId") or ""
              rule = rules_by_id.get(rule_id) or {}
              default = (rule.get("defaultConfiguration") or {}).get("level") or ""
              return (default or "warning").strip().lower()


          def result_location(result: dict) -> str:
              locations = result.get("locations") or []
              if not locations or not isinstance(locations[0], dict):
                  return "—"
              phys = locations[0].get("physicalLocation") or {}
              uri = ((phys.get("artifactLocation") or {}).get("uri")) or "—"
              region = phys.get("region") or {}
              line = region.get("startLine")
              if line:
                  return f"{uri}:{line}"
              return str(uri)


          def result_message(result: dict) -> str:
              message = result.get("message") or {}
              if isinstance(message, dict):
                  return truncate(message.get("text") or message.get("markdown") or "")
              return truncate(str(message))


          def parse_sarif(path: Path) -> ToolReport:
              try:
                  data = json.loads(path.read_text(encoding="utf-8") or "{}")
              except (OSError, json.JSONDecodeError) as exc:
                  return ToolReport(
                      name=path.stem,
                      source_file=path.name,
                      present=True,
                      note=f"Could not parse SARIF: {exc}",
                  )
              findings: list[Finding] = []
              tool_names: list[str] = []
              for run in data.get("runs") or []:
                  if not isinstance(run, dict):
                      continue
                  driver = ((run.get("tool") or {}).get("driver")) or {}
                  name = driver.get("name") or path.stem
                  tool_names.append(str(name))
                  rules_by_id = {}
                  for rule in driver.get("rules") or []:
                      if isinstance(rule, dict) and rule.get("id"):
                          rules_by_id[rule["id"]] = rule
                  for result in run.get("results") or []:
                      if not isinstance(result, dict):
                          continue
                      findings.append(
                          Finding(
                              rule_id=str(result.get("ruleId") or "—"),
                              level=result_level(result, rules_by_id),
                              location=result_location(result),
                              message=result_message(result),
                          )
                      )
              display = tool_names[0] if len(set(tool_names)) == 1 else (tool_names[0] if tool_names else path.stem)
              if len(set(tool_names)) > 1:
                  display = f"{display} (+{len(set(tool_names)) - 1} tools)"
              return ToolReport(name=str(display), source_file=path.name, present=True, findings=findings)


          def _pip_audit_rows(data: object) -> list[dict]:
              if isinstance(data, list):
                  return [row for row in data if isinstance(row, dict)]
              if isinstance(data, dict):
                  deps = data.get("dependencies")
                  if isinstance(deps, list):
                      return [row for row in deps if isinstance(row, dict)]
              return []


          def parse_pip_audit(path: Path) -> ToolReport:
              try:
                  data = json.loads(path.read_text(encoding="utf-8") or "{}")
              except (OSError, json.JSONDecodeError) as exc:
                  return ToolReport(
                      name="pip-audit",
                      source_file=path.name,
                      present=True,
                      note=f"Could not parse pip-audit JSON: {exc}",
                  )
              findings: list[Finding] = []
              for dep in _pip_audit_rows(data):
                  pkg = dep.get("name") or "package"
                  version = dep.get("version") or "?"
                  for vuln in dep.get("vulns") or []:
                      if not isinstance(vuln, dict):
                          continue
                      vuln_id = vuln.get("id") or "unspecified"
                      fixes = vuln.get("fix_versions") or []
                      if isinstance(fixes, list):
                          fix_txt = ", ".join(str(v) for v in fixes) or "none listed"
                      else:
                          fix_txt = str(fixes)
                      desc = truncate(vuln.get("description") or "")
                      msg = f"{pkg} {version}; fix: {fix_txt}"
                      if desc:
                          msg = f"{msg}. {desc}"
                      findings.append(
                          Finding(
                              rule_id=str(vuln_id),
                              level="warning",
                              location=f"{pkg}=={version}",
                              message=truncate(msg),
                          )
                      )
              return ToolReport(name="pip-audit", source_file=path.name, present=True, findings=findings)


          def collect_reports(input_dir: Path) -> list[ToolReport]:
              reports: list[ToolReport] = []
              if not input_dir.is_dir():
                  return reports
              for path in sorted(input_dir.glob("*.sarif")):
                  if path.name in SKIP_NAMES:
                      continue
                  reports.append(parse_sarif(path))
              pip_audit = input_dir / "pip-audit.json"
              if pip_audit.is_file():
                  reports.append(parse_pip_audit(pip_audit))
              return reports


          def level_counts(findings: list[Finding]) -> str:
              counts = Counter(f.level for f in findings)
              if not findings:
                  return "0"
              order = ["error", "warning", "note", "none"]
              parts = [f"{lvl}={counts[lvl]}" for lvl in order if counts.get(lvl)]
              extra = sorted(k for k in counts if k not in order)
              parts.extend(f"{lvl}={counts[lvl]}" for lvl in extra)
              return f"{len(findings)} ({', '.join(parts)})"


          def _styles() -> dict:
              styles = getSampleStyleSheet()
              styles.add(
                  ParagraphStyle(
                      name="Meta",
                      parent=styles["Normal"],
                      fontName="Helvetica",
                      fontSize=9,
                      leading=12,
                      textColor=colors.HexColor("#333333"),
                  )
              )
              styles.add(
                  ParagraphStyle(
                      name="Cell",
                      parent=styles["Normal"],
                      fontName="Helvetica",
                      fontSize=8,
                      leading=10,
                  )
              )
              styles.add(
                  ParagraphStyle(
                      name="CellHead",
                      parent=styles["Normal"],
                      fontName="Helvetica-Bold",
                      fontSize=8,
                      leading=10,
                  )
              )
              return styles


          def _table(rows: list[list], col_widths: list[float]) -> Table:
              table = Table(rows, colWidths=col_widths, repeatRows=1)
              table.setStyle(
                  TableStyle(
                      [
                          ("GRID", (0, 0), (-1, -1), 0.4, colors.grey),
                          ("BACKGROUND", (0, 0), (-1, 0), colors.HexColor("#e8eef4")),
                          ("VALIGN", (0, 0), (-1, -1), "TOP"),
                          ("LEFTPADDING", (0, 0), (-1, -1), 4),
                          ("RIGHTPADDING", (0, 0), (-1, -1), 4),
                          ("TOPPADDING", (0, 0), (-1, -1), 3),
                          ("BOTTOMPADDING", (0, 0), (-1, -1), 3),
                      ]
                  )
              )
              return table


          def build_story(reports: list[ToolReport], args: argparse.Namespace) -> list:
              styles = _styles()
              cell, head = styles["Cell"], styles["CellHead"]
              story: list = [
                  Paragraph(pdf_safe(args.title), styles["Title"]),
                  Spacer(1, 8),
                  Paragraph(f"<b>Repository:</b> {pdf_safe(args.repo)}", styles["Meta"]),
                  Paragraph(f"<b>Commit:</b> {pdf_safe(args.sha)}", styles["Meta"]),
                  Paragraph(f"<b>Workflow run:</b> {pdf_safe(args.run_url)}", styles["Meta"]),
                  Paragraph(
                      f"<b>Generated (UTC):</b> {pdf_safe(datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%SZ'))}",
                      styles["Meta"],
                  ),
                  Paragraph(
                      "Machine-readable reports remain SARIF 2.1.0. This PDF is a human download. "
                      "Source snippets are omitted so secret-scanner matches are not echoed.",
                      styles["Meta"],
                  ),
                  Spacer(1, 14),
                  Paragraph("Summary", styles["Heading1"]),
              ]
              usable = 7.5 * inch
              if not reports:
                  story.append(Paragraph("No scanner outputs were produced in security-reports/.", styles["Normal"]))
                  return story

              summary_rows = [[
                  Paragraph("Tool", head),
                  Paragraph("File", head),
                  Paragraph("Present", head),
                  Paragraph("Findings", head),
              ]]
              for report in reports:
                  summary_rows.append([
                      Paragraph(pdf_safe(report.name), cell),
                      Paragraph(pdf_safe(report.source_file), cell),
                      Paragraph("yes" if report.present else "no", cell),
                      Paragraph(pdf_safe(level_counts(report.findings)), cell),
                  ])
              story.append(_table(summary_rows, [1.6 * inch, 2.0 * inch, 0.8 * inch, usable - 4.4 * inch]))
              story.append(Spacer(1, 12))

              for index, report in enumerate(reports):
                  if index:
                      story.append(PageBreak())
                  story.append(Paragraph(pdf_safe(f"{report.name} ({report.source_file})"), styles["Heading1"]))
                  if report.note:
                      story.append(Paragraph(pdf_safe(report.note), styles["Normal"]))
                  if not report.findings:
                      story.append(Paragraph("No findings in this report.", styles["Normal"]))
                      continue
                  shown = report.findings[:MAX_FINDINGS_PER_TOOL]
                  omitted = len(report.findings) - len(shown)
                  rows = [[
                      Paragraph("Level", head),
                      Paragraph("Rule", head),
                      Paragraph("Location", head),
                      Paragraph("Message", head),
                  ]]
                  for finding in shown:
                      rows.append([
                          Paragraph(pdf_safe(finding.level), cell),
                          Paragraph(pdf_safe(finding.rule_id), cell),
                          Paragraph(pdf_safe(finding.location), cell),
                          Paragraph(pdf_safe(finding.message).replace("\n", "<br/>"), cell),
                      ])
                  story.append(
                      _table(rows, [0.8 * inch, 1.6 * inch, 2.0 * inch, usable - 4.4 * inch])
                  )
                  if omitted > 0:
                      story.append(Spacer(1, 6))
                      story.append(
                          Paragraph(pdf_safe(f"… and {omitted} more finding(s) not listed."), styles["Meta"])
                      )
              return story


          def add_page_number(canvas, doc) -> None:
              canvas.saveState()
              canvas.setFont("Helvetica", 8)
              canvas.setFillColor(colors.HexColor("#555555"))
              canvas.drawString(0.75 * inch, 0.45 * inch, "Combined security report")
              canvas.drawRightString(letter[0] - 0.75 * inch, 0.45 * inch, f"Page {doc.page}")
              canvas.restoreState()


          def write_pdf(reports: list[ToolReport], args: argparse.Namespace) -> None:
              output = Path(args.output)
              output.parent.mkdir(parents=True, exist_ok=True)
              doc = SimpleDocTemplate(
                  str(output),
                  pagesize=letter,
                  leftMargin=0.75 * inch,
                  rightMargin=0.75 * inch,
                  topMargin=0.7 * inch,
                  bottomMargin=0.7 * inch,
                  title=args.title,
                  author="Heavy Rental Integration CI",
              )
              doc.build(build_story(reports, args), onFirstPage=add_page_number, onLaterPages=add_page_number)


          def parse_args(argv: list[str] | None = None) -> argparse.Namespace:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--input-dir", required=True)
              parser.add_argument("--output", required=True)
              parser.add_argument("--title", default="Combined security report")
              parser.add_argument("--repo", default="")
              parser.add_argument("--sha", default="")
              parser.add_argument("--run-url", default="")
              return parser.parse_args(argv)


          def main(argv: list[str] | None = None) -> int:
              args = parse_args(argv)
              reports = collect_reports(Path(args.input_dir))
              write_pdf(reports, args)
              output = Path(args.output)
              if not output.is_file() or output.stat().st_size == 0:
                  print(f"error: PDF was not written: {output}", file=sys.stderr)
                  return 1
              print(f"Wrote {output} ({output.stat().st_size} bytes, {len(reports)} report(s))")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          COMBINE_SECURITY_REPORT_PY
          python3 "${REPORT_DIR}/combine-security-report.py" \
            --input-dir "${REPORT_DIR}" \
            --output "${REPORT_DIR}/combined-security-report.pdf" \
            --title "${COMBINED_PDF_TITLE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test -s "${REPORT_DIR}/combined-security-report.pdf"

      - name: Upload combined security report (PDF)
        if: always() && hashFiles('security-reports/combined-security-report.pdf') != ''
        id: upload-security-pdf
        uses: actions/upload-artifact@v7
        with:
          name: security-combined-report-pdf
          path: security-reports/combined-security-report.pdf
          retention-days: 30
          if-no-files-found: warn

      - name: Publish PDF download on Checks
        if: always() && steps.upload-security-pdf.outputs.artifact-url != ''
        env:
          PDF_URL: ${{ steps.upload-security-pdf.outputs.artifact-url }}
        run: |
          {
            echo "### Combined security report (PDF)"
            echo ""
            echo "Download from this check: [combined-security-report.pdf](${PDF_URL})"
            echo ""
            echo "Artifact: \`security-combined-report-pdf\`."
            echo "On a pull request: Checks → this workflow run → Artifacts, or this job summary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish PDF check on pull request
        if: always() && github.event_name == 'pull_request' && steps.upload-security-pdf.outputs.artifact-url != ''
        continue-on-error: true
        env:
          PDF_URL: ${{ steps.upload-security-pdf.outputs.artifact-url }}
        uses: actions/github-script@v9
        with:
          script: |
            const url = process.env.PDF_URL;
            const sha = context.payload.pull_request.head.sha;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Security combined report (PDF)',
              head_sha: sha,
              status: 'completed',
              conclusion: 'neutral',
              details_url: url,
              output: {
                title: 'Download combined security report PDF',
                summary: [
                  'Combined SAST/SCA report for this pull request.',
                  '',
                  '[Download combined-security-report.pdf](' + url + ')',
                  '',
                  'Also on this workflow run: Checks → Summary → Artifacts → `security-combined-report-pdf`.',
                ].join('\n'),
              },
            });

      - name: Upload security reports (SARIF)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-sarif
          path: |
            security-reports/*.sarif
            security-reports/combined-security-report.pdf
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 4. CodeQL analysis — GitHub CodeQL for Java (security + quality queries)
  #    Runs after Integration Check; parallel with QC and Semgrep/Trivy Security.
  #    Results appear under the repository Security → Code scanning alerts.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [integration-check]
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout calling repository (PR / push head)
        if: needs.integration.outputs.checkout_mode == 'caller'
        uses: actions/checkout@v7
        with:
          path: ${{ env.APP_PATH }}

      - name: Checkout remote application repository
        if: needs.integration.outputs.checkout_mode == 'remote'
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.integration-check.outputs.app_repository }}
          ref: ${{ needs.integration-check.outputs.app_ref }}
          path: ${{ env.APP_PATH }}

      - name: Initialize CodeQL (Java)
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          source-root: ${{ env.APP_PATH }}
          # security-and-quality: security rules + maintainability / reliability
          queries: security-and-quality

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.APP_PATH }}/pom.xml

      - name: Build for CodeQL (Maven; skip tests)
        working-directory: ${{ env.APP_PATH }}
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          # CodeQL instruments this compile/package build for analysis
          ./mvnw -B -ntp -DskipTests package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "rest-api-ci-codeql-java"
        # Allow run to complete if Code Scanning API is unavailable; still fail on tool errors
        # by default. Set continue-on-error only if GHAS is optional in your org.
        # continue-on-error: true

      - name: CodeQL summary
        if: always()
        run: |
          {
            echo "### CodeQL Analysis"
            echo ""
            echo "Language: Java/Kotlin"
            echo "Query suite: security-and-quality"
            echo "Category: rest-api-ci-codeql-java"
            echo ""
            echo "View results: repository → Security → Code scanning alerts"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. GitHub Flow CI gate — aggregate status for branch protection
  #    Integration Check is evaluated first (highest priority); then QC, Security, CodeQL.
  # ---------------------------------------------------------------------------
  github-flow-gate:
    name: GitHub Flow CI Gate
    runs-on: ubuntu-latest
    # Always run so a failed Integration Check still produces a red gate check
    if: always()
    needs: [integration-check, quality-control, security-testing, codeql]
    timeout-minutes: 5
    steps:
      - name: Enforce Integration Check priority and full CI green
        run: |
          set -euo pipefail
          INTEGRATION="${{ needs.integration-check.result }}"
          QUALITY="${{ needs.quality-control.result }}"
          SECURITY="${{ needs.security-testing.result }}"
          CODEQL="${{ needs.codeql.result }}"

          {
            echo "### GitHub Flow CI gate"
            echo ""
            echo "| Job | Result | Priority |"
            echo "| --- | --- | --- |"
            echo "| Integration Check | \`${INTEGRATION}\` | **1 (highest)** |"
            echo "| Quality Control | \`${QUALITY}\` | 2 |"
            echo "| Security Testing | \`${SECURITY}\` | 2 |"
            echo "| CodeQL Analysis | \`${CODEQL}\` | 2 |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Integration Check (priority 1): ${INTEGRATION}"
          echo "Quality Control (priority 2): ${QUALITY}"
          echo "Security Testing (priority 2): ${SECURITY}"
          echo "CodeQL Analysis (priority 2): ${CODEQL}"

          if [ "${INTEGRATION}" != "success" ]; then
            echo "::error::Integration Check is the highest-priority gate and did not succeed (result=${INTEGRATION})."
            echo "Fix Integration Check before Quality Control / Security Testing / CodeQL can proceed."
            exit 1
          fi
          if [ "${QUALITY}" != "success" ]; then
            echo "::error::Quality Control did not succeed (result=${QUALITY})."
            exit 1
          fi
          if [ "${SECURITY}" != "success" ]; then
            echo "::error::Security Testing did not succeed (result=${SECURITY})."
            exit 1
          fi
          if [ "${CODEQL}" != "success" ]; then
            echo "::error::CodeQL Analysis did not succeed (result=${CODEQL})."
            exit 1
          fi

          echo "GitHub Flow CI gate passed: Integration Check first, then Quality Control + Security Testing + CodeQL."
