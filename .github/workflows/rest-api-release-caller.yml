# =============================================================================
# Install into: heavy-rental-spring-rest-api
# Path:         .github/workflows/rest-api-release-caller.yml
# =============================================================================
# Release caller — runs only when:
#   1. A GitHub Release is published, or
#   2. A pull request is opened/updated from develop → master
#
# Place both files in the Spring REST API repository:
#
#   .github/workflows/rest-api-release-caller.yml  ← this file (triggers)
#   .github/workflows/release-pipeline.yml         ← reusable pipeline (called)
#
# GitHub Environments + secrets
# -----------------------------
# This job uses environment: production so environment-scoped secrets work
# with secrets: inherit for both:
#
#   develop → master PR
#   release published
#
# Create Environment "production" (Settings → Environments) and add:
#
#   REST_API_CLOUD_DB_NAME
#   REST_API_CLOUD_DB_USER
#   REST_API_CLOUD_DB_PASSWORD
#   REST_API_CLOUD_DB_PORT
#   REST_API_CLOUD_DB_URL
#
# CI (rest-api-ci-caller) uses environment: integration with REST_API_DB_* instead.
#
# Job priority
# ------------
#   1. Integration
#   2. Quality Control (uses Environment cloud secrets)
#   2. Security Testing
#   2. CodeQL Analysis
#   3. Packaging (needs QC + Security + CodeQL)
# =============================================================================

name: Release

on:
  release:
    types: [published]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: rest-api-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read
  packages: write

jobs:
  release-pipeline:
    name: Release pipeline
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'develop' &&
       github.base_ref == 'master')
    # Production Environment for secrets: inherit (PR develop→master and published release)
    environment: production
    uses: ./.github/workflows/release-pipeline.yml
    with:
      # Must match `environment:` so QC attaches the same Environment
      github_environment: production
    secrets: inherit
