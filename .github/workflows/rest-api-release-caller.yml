# =============================================================================
# Install into: heavy-rental-spring-rest-api
# Path:         .github/workflows/rest-api-release-caller.yml
# =============================================================================
# Release caller — manual dispatch only (Actions → Release → Run workflow).
# Checks out master, runs QC, builds the image, DAST, then public GHCR + GitHub Release.
# Do not use on: release — this workflow creates the GitHub Release.
#
# Do NOT set `environment:` on this caller job (invalid with uses:).
# QC inside the reusable workflow uses environment: production.
#
# Add secrets (Environment "production" and/or Repository secrets):
#   REST_API_DB_NAME
#   REST_API_DB_USER
#   REST_API_DB_PASSWORD
#   REST_API_DB_PORT
#
# REST_API_DB_URL is optional — after Docker Postgres starts, QC builds:
#   jdbc:postgresql://localhost:<PORT>/<NAME>
#
# These start a local Docker Postgres for tests. They are not Academy RDS.
# Guest CD reads heavy-rental/rest (infra sync-secrets).
# =============================================================================

name: Release

on:
  workflow_dispatch:

concurrency:
  group: rest-api-release-${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  security-events: write
  actions: read
  packages: write

jobs:
  release-pipeline:
    name: Release pipeline
    uses: ./.github/workflows/release-pipeline.yml
    with:
      github_environment: production
    secrets:
      REST_API_DB_NAME: ${{ secrets.REST_API_DB_NAME }}
      REST_API_DB_USER: ${{ secrets.REST_API_DB_USER }}
      REST_API_DB_PASSWORD: ${{ secrets.REST_API_DB_PASSWORD }}
      REST_API_DB_PORT: ${{ secrets.REST_API_DB_PORT }}
