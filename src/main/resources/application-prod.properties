# Sample for Heavy-Rental/heavy-rental-spring-rest-api
# Copy to: src/main/resources/application-prod.properties
# (hyphen — not application.prod.properties)
#
# The Release image sets SPRING_PROFILES_ACTIVE=prod so this file is loaded.
# Values that MUST come from AWS / GitHub academy (heavy-rental/rest → compose .env)
# use ${NAME} with no insecure default. Release packaging fails if this file
# contains Stripe secret material, the default JWT string, or a baked JDBC URL.

spring.application.name=rest_api
server.port=8080
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

# --- From infra sync-secrets (SoR RDS). Do not put lab hostnames here. ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOSTNAME}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
# Academy CD overlay: set APP_SEED_DATA_SQL=true to run classpath:data.sql after Flyway.
app.seed.data-sql=${APP_SEED_DATA_SQL:false}

# Prod only (Release image sets SPRING_PROFILES_ACTIVE=prod). Flyway owns DDL.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

# --- JWT: APP_JWT_SECRET from SM (generated or Environment academy). Issuer/TTL stay here. ---
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.issuer=heavy-rental-rest-api
app.jwt.expirationMinutes=60

# --- Stripe: infra Environment academy secrets → SM ---
stripe.api.key=${STRIPE_API_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# --- OneMap: optional infra Environment academy secrets ---
onemap.email=${ONEMAP_EMAIL:}
onemap.password=${ONEMAP_PASSWORD:}
onemap.base-url=https://www.onemap.gov.sg
onemap.token-refresh-buffer=6h
onemap.timeouts.connect=3s
onemap.timeouts.read=5s
onemap.resilience.circuit-breaker-failure-rate-threshold=50
onemap.resilience.circuit-breaker-sliding-window-size=10
onemap.resilience.circuit-breaker-minimum-number-of-calls=5
onemap.resilience.circuit-breaker-wait-duration-in-open-state=30s
onemap.resilience.bulkhead-max-concurrent=10

# --- CORS: infra writes APP_CORS_ALLOWED_ORIGINS=http://<portal_alb_dns> ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# --- Haystack: infra writes HAYSTACK_BASE_URL=http://<haystack_alb_dns>:8000 ---
haystack.base-url=${HAYSTACK_BASE_URL}
haystack.timeouts.connect=5s
haystack.timeouts.health-read=5s
haystack.timeouts.qa-read=45s
haystack.timeouts.recommend-read=90s
haystack.timeouts.ingest-read=180s
haystack.timeouts.pricing-read=20s
haystack.max-in-memory-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true
haystack.retry.ingest-enabled=false
haystack.retry.ingest-max-attempts=2
haystack.retry.recommend-max-attempts=2
haystack.retry.qa-max-attempts=2
haystack.retry.pricing-max-attempts=1
haystack.resilience.circuit-breaker-failure-rate-threshold=50
haystack.resilience.circuit-breaker-sliding-window-size=10
haystack.resilience.circuit-breaker-minimum-number-of-calls=5
haystack.resilience.circuit-breaker-wait-duration-in-open-state=30s
haystack.resilience.bulkhead-ingest-max-concurrent=5
haystack.resilience.bulkhead-recommend-max-concurrent=10
haystack.resilience.bulkhead-qa-max-concurrent=10
haystack.resilience.bulkhead-pricing-max-concurrent=10

# --- Pricing: defaults here; REST/infra academy vars overlay if set ---
pricing.dynamic-enabled=${DYNAMIC_PRICING_ENABLED:true}
pricing.default-distance-km=${PRICING_DEFAULT_DISTANCE_KM:20.0}
pricing.origin-postal-code=${PRICING_ORIGIN_POSTAL_CODE:629462}
pricing.distance-lookup-enabled=${PRICING_DISTANCE_LOOKUP_ENABLED:true}
