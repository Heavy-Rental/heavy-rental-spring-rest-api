spring.application.name=rest_api
server.port=8080
# Raised so an admin asset-image upload (base64 JSON body, ~7MB cap enforced in
# AssetService) isn't rejected by Tomcat before it reaches the controller.
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

# PostgreSQL datasource (existing environment: POSTGRES_HOSTNAME=db, POSTGRES_DB/USER/PASSWORD=postgres)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOSTNAME:db}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# JWT (HS256 requires secret of at least 32 characters — override in production)
app.jwt.secret=${APP_JWT_SECRET:change-me-to-a-long-random-secret-key!!}
app.jwt.issuer=${APP_JWT_ISSUER:heavy-rental-rest-api}
app.jwt.expirationMinutes=${APP_JWT_EXPIRATION_MINUTES:60}

# Google Sign-In (Android Credential Manager) — Web application OAuth client ID,
# used as the expected audience when verifying Google ID tokens server-side.
app.google.web-client-id=${APP_GOOGLE_WEB_CLIENT_ID:313475501082-t9i007sog897m9tafkjp2c8lot3kinrv.apps.googleusercontent.com}

# Stripe Test Credentials
stripe.api.key=${STRIPE_API_KEY:YOUR_STRIPE_SECRET_KEY_HERE}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:YOUR_STRIPE_PUBLISHABLE_KEY_HERE}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_YOUR_WEBHOOK_SECRET_HERE}

# CORS — comma-separated allowed browser origins for the React frontend. Defaults cover
# local Vite dev (5173) and `vite preview` (4173) only; the Vite dev-server proxy
# (dev/dev:mock/dev:api) doesn't need this at all since it never makes a cross-origin
# browser request. Override with the real deployed frontend origin(s) in production —
# there is deliberately no wildcard default here, since a wildcard origin is incompatible
# with Authorization-header-bearing requests being treated as anything but fully public.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# Haystack recommender client (S2b) — private network; not browser-facing
# Call 1 ingest · Call 2 recommend/quote · Call 3 chatbot Q&A
haystack.base-url=${HAYSTACK_BASE_URL:http://haystack-fast-api:8000}
haystack.timeouts.connect=${HAYSTACK_CONNECT_TIMEOUT:5s}
haystack.timeouts.health-read=${HAYSTACK_HEALTH_READ_TIMEOUT:5s}
haystack.timeouts.qa-read=${HAYSTACK_QA_READ_TIMEOUT:45s}
haystack.timeouts.recommend-read=${HAYSTACK_RECOMMEND_READ_TIMEOUT:90s}
haystack.timeouts.ingest-read=${HAYSTACK_INGEST_READ_TIMEOUT:180s}
# Max project file / body size — same number on gateway, Spring servlet, and FastAPI.
haystack.max-in-memory-size=${HAYSTACK_MAX_IN_MEMORY_SIZE:20MB}
spring.servlet.multipart.max-file-size=${HAYSTACK_MAX_IN_MEMORY_SIZE:20MB}
spring.servlet.multipart.max-request-size=${HAYSTACK_MAX_IN_MEMORY_SIZE:20MB}
spring.servlet.multipart.enabled=true
# Production ingest retry requires haystack S2a; keep false until confirmed on target env
haystack.retry.ingest-enabled=${HAYSTACK_INGEST_RETRY_ENABLED:false}
haystack.retry.ingest-max-attempts=${HAYSTACK_INGEST_RETRY_MAX:2}
haystack.retry.recommend-max-attempts=${HAYSTACK_RECOMMEND_RETRY_MAX:2}
haystack.retry.qa-max-attempts=${HAYSTACK_QA_RETRY_MAX:2}
haystack.resilience.circuit-breaker-failure-rate-threshold=${HAYSTACK_CB_FAILURE_RATE:50}
haystack.resilience.circuit-breaker-sliding-window-size=${HAYSTACK_CB_WINDOW:10}
haystack.resilience.circuit-breaker-minimum-number-of-calls=${HAYSTACK_CB_MIN_CALLS:5}
haystack.resilience.circuit-breaker-wait-duration-in-open-state=${HAYSTACK_CB_WAIT:30s}
haystack.resilience.bulkhead-ingest-max-concurrent=${HAYSTACK_BULKHEAD_INGEST:5}
haystack.resilience.bulkhead-recommend-max-concurrent=${HAYSTACK_BULKHEAD_RECOMMEND:10}
haystack.resilience.bulkhead-qa-max-concurrent=${HAYSTACK_BULKHEAD_QA:10}